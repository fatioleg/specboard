<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SpecBoard</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%2322d3ee'/%3E%3Cstop offset='100%25' stop-color='%232563eb'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Ctext x='16' y='21' text-anchor='middle' fill='%2304131c' font-family='system-ui,sans-serif' font-size='14' font-weight='800'%3ESB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* SpecBoard v2.2 — Linguagem visual luminosa (grade pontilhada + cartões com pílula no topo + brilho ciano/esmeralda)
   tanto no Modo Claro quanto no Modo Escuro, com área de Bugs & Melhorias conectada ao MCP. */
:root{
  --bg:#f2f7fb; --canvas-dot:rgba(8,145,178,.13);
  --halo-1:rgba(14,165,233,.11); --halo-2:rgba(16,185,129,.10);
  --surface:rgba(255,255,255,.94); --surface-solid:#ffffff; --surface-2:#eef4f9; --surface-glass:rgba(248,252,255,.88);
  --fg:#0b172a; --muted:#475569; --line:rgba(14,116,144,.16); --line-strong:rgba(14,116,144,.30);
  --accent:#0891b2; --accent-hi:#06b6d4; --accent-soft:rgba(8,145,178,.11); --accent-glow:rgba(6,182,212,.28);
  --ok:#059669; --ok-hi:#10b981; --ok-soft:rgba(16,185,129,.13); --ok-glow:rgba(16,185,129,.28);
  --exe:#d97706; --exe-hi:#f59e0b; --exe-soft:rgba(245,158,11,.15); --exe-glow:rgba(245,158,11,.26);
  --rev:#2563eb; --rev-soft:rgba(37,99,235,.12);
  --pause:#6d28d9; --pause-soft:rgba(124,58,237,.12);
  --run:#2563eb; --run-soft:rgba(37,99,235,.12);
  --block:#e11d48; --block-soft:rgba(225,29,72,.11);
  --wait:#64748b; --wait-soft:rgba(100,116,139,.13);
  --edge:#94a3b8;
  --pill-ink:#031521;
  --shadow:0 4px 20px rgba(8,47,73,.06), 0 1px 3px rgba(8,47,73,.05);
  --shadow-lg:0 18px 42px rgba(8,47,73,.12);
  --shadow-cyan:0 10px 30px rgba(6,182,212,.14), 0 1px 3px rgba(8,47,73,.05);
  --shadow-ok:0 14px 36px rgba(16,185,129,.17), 0 2px 6px rgba(8,47,73,.06);
  --f-display:"Plus Jakarta Sans","Inter","Segoe UI",system-ui,sans-serif;
  --f-body:"Inter","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#070d18; --canvas-dot:rgba(56,189,248,.13);
  --halo-1:rgba(34,211,238,.13); --halo-2:rgba(52,211,153,.13);
  --surface:rgba(15,24,41,.90); --surface-solid:#10192b; --surface-2:#162238; --surface-glass:rgba(8,14,26,.86);
  --fg:#f1f5f9; --muted:#94a3b8; --line:rgba(56,189,248,.17); --line-strong:rgba(56,189,248,.34);
  --accent:#22d3ee; --accent-hi:#38bdf8; --accent-soft:rgba(34,211,238,.13); --accent-glow:rgba(34,211,238,.36);
  --ok:#34d399; --ok-hi:#34d399; --ok-soft:rgba(52,211,153,.15); --ok-glow:rgba(52,211,153,.36);
  --exe:#fbbf24; --exe-hi:#f59e0b; --exe-soft:rgba(251,191,36,.15); --exe-glow:rgba(251,191,36,.32);
  --rev:#60a5fa; --rev-soft:rgba(96,165,250,.15);
  --pause:#a78bfa; --pause-soft:rgba(167,139,250,.16);
  --run:#60a5fa; --run-soft:rgba(96,165,250,.16);
  --block:#fb7185; --block-soft:rgba(251,113,133,.15);
  --wait:#94a3b8; --wait-soft:rgba(148,163,184,.16);
  --edge:#475569;
  --pill-ink:#031521;
  --shadow:0 6px 24px rgba(0,0,0,.34);
  --shadow-lg:0 22px 52px rgba(0,0,0,.58);
  --shadow-cyan:0 0 34px rgba(34,211,238,.15), 0 10px 28px rgba(0,0,0,.40);
  --shadow-ok:0 0 40px rgba(52,211,153,.19), 0 14px 34px rgba(0,0,0,.45);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#070d18; --canvas-dot:rgba(56,189,248,.13);
  --halo-1:rgba(34,211,238,.13); --halo-2:rgba(52,211,153,.13);
  --surface:rgba(15,24,41,.90); --surface-solid:#10192b; --surface-2:#162238; --surface-glass:rgba(8,14,26,.86);
  --fg:#f1f5f9; --muted:#94a3b8; --line:rgba(56,189,248,.17); --line-strong:rgba(56,189,248,.34);
  --accent:#22d3ee; --accent-hi:#38bdf8; --accent-soft:rgba(34,211,238,.13); --accent-glow:rgba(34,211,238,.36);
  --ok:#34d399; --ok-hi:#34d399; --ok-soft:rgba(52,211,153,.15); --ok-glow:rgba(52,211,153,.36);
  --exe:#fbbf24; --exe-hi:#f59e0b; --exe-soft:rgba(251,191,36,.15); --exe-glow:rgba(251,191,36,.32);
  --rev:#60a5fa; --rev-soft:rgba(96,165,250,.15);
  --pause:#a78bfa; --pause-soft:rgba(167,139,250,.16);
  --run:#60a5fa; --run-soft:rgba(96,165,250,.16);
  --block:#fb7185; --block-soft:rgba(251,113,133,.15);
  --wait:#94a3b8; --wait-soft:rgba(148,163,184,.16);
  --edge:#475569;
  --pill-ink:#031521;
  --shadow:0 6px 24px rgba(0,0,0,.34);
  --shadow-lg:0 22px 52px rgba(0,0,0,.58);
  --shadow-cyan:0 0 34px rgba(34,211,238,.15), 0 10px 28px rgba(0,0,0,.40);
  --shadow-ok:0 0 40px rgba(52,211,153,.19), 0 14px 34px rgba(0,0,0,.45);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{
  margin:0;padding:0;min-height:100%;color:var(--fg);font:14px/1.55 var(--f-body);
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  background-color:var(--bg);
  background-image:
    radial-gradient(ellipse 65% 42% at 50% -6%, var(--halo-2), transparent 68%),
    radial-gradient(ellipse 45% 35% at 15% 18%, var(--halo-1), transparent 70%),
    radial-gradient(var(--canvas-dot) 1.25px, transparent 1.25px);
  background-size:100% 100%, 100% 100%, 22px 22px;
  background-attachment:fixed;
}
h1,h2,h3,h4{margin:0;font-family:var(--f-display);letter-spacing:-.015em}
p{margin:0}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code,pre,.mono{font-family:var(--f-mono);font-size:12px}
.muted{color:var(--muted)}
.wrap-any{min-width:0;overflow-wrap:anywhere;word-break:break-word}
.clamp1{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.shell{min-height:100vh;display:flex;flex-direction:column}

/* === BARRA SUPERIOR GLASSMÓRFICA === */
.nav{position:sticky;top:0;z-index:45;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 18px;background:var(--surface-glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line);flex-wrap:nowrap}
.nav-left,.nav-right{display:flex;align-items:center;gap:6px;min-width:0}
.brand-btn{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:2px 5px 2px 2px;border-radius:11px;cursor:pointer;text-align:left;min-width:0}
.brand-btn:hover{background:var(--accent-soft)}
.brand-logo{width:32px;height:32px;border-radius:9px;object-fit:cover;border:1.5px solid var(--accent-glow);box-shadow:0 0 12px var(--accent-soft);flex:0 0 auto;background:#021324}
.proj-title{font:800 14px var(--f-display);max-width:190px}
.home-quick-btn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line-strong);background:var(--surface-solid);color:var(--fg);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer;transition:all .14s;white-space:nowrap}
.home-quick-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.home-quick-btn.is-away{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);box-shadow:0 0 14px var(--accent-soft)}
.q-toggle{border:1px solid var(--line);background:var(--surface-2);color:var(--muted);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap}
.q-toggle:hover{border-color:var(--accent);color:var(--fg)}

.seg-tabs{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex:0 0 auto}
.seg-tab{border:0;background:transparent;color:var(--muted);padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:all .14s;white-space:nowrap}
.seg-tab:hover{color:var(--fg)}
.seg-tab[aria-selected="true"]{background:var(--surface-solid);color:var(--fg);box-shadow:0 2px 10px rgba(0,0,0,.14), 0 0 0 1px var(--line-strong)}
.seg-badge{background:var(--exe-soft);color:var(--exe);border-radius:999px;padding:1px 6px;font-size:10.5px;font-weight:800}
.seg-badge.is-bug{background:var(--block-soft);color:var(--block)}

.pill-btn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface-solid);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer;transition:all .14s;white-space:nowrap}
.pill-btn:hover{border-color:var(--accent);box-shadow:0 0 14px var(--accent-soft)}
.pill-btn.bug-cta{border-color:rgba(245,158,11,.42);background:var(--exe-soft);color:var(--exe);font-weight:700}
.pill-btn.bug-cta:hover{border-color:var(--exe);box-shadow:0 0 16px var(--exe-glow)}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border:1px solid var(--line);background:var(--surface-solid);border-radius:999px;cursor:pointer;font-size:14px;transition:all .14s}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.dot-live{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
.dot-static{width:7px;height:7px;border-radius:50%;background:var(--wait)}

.q-drawer{padding:11px 22px;background:var(--surface-solid);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:13.5px}
.offline-tip{padding:9px 22px;background:var(--surface-2);border-bottom:1px solid var(--line);font-size:13px;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* === CONTAINER === */
.main{width:100%;max-width:1360px;margin:0 auto;padding:22px 22px 48px;display:grid;gap:20px;flex:1}
.main.full-bleed{max-width:1660px}

/* === BOTÕES EM PÍLULA LUMINOSA (ESTILO DA FIGURA HERO!) === */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface-solid);color:var(--fg);border-radius:999px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px);box-shadow:0 4px 16px var(--accent-soft)}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none;box-shadow:none}
.btn-accent{background:linear-gradient(135deg, var(--accent-hi), var(--accent));border-color:transparent;color:var(--pill-ink);box-shadow:0 6px 20px var(--accent-glow)}
.btn-accent:hover:not(:disabled){filter:brightness(1.06);box-shadow:0 8px 24px var(--accent-glow)}
.btn-ok{background:linear-gradient(135deg, var(--ok-hi), var(--ok));border-color:transparent;color:#031c13;box-shadow:0 6px 20px var(--ok-glow)}
.btn-ok:hover:not(:disabled){filter:brightness(1.06);box-shadow:0 8px 26px var(--ok-glow)}
.btn-amber{background:linear-gradient(135deg, #fbbf24, #f59e0b);border-color:transparent;color:#1c1103;box-shadow:0 6px 20px var(--exe-glow)}
.btn-amber:hover:not(:disabled){filter:brightness(1.05);box-shadow:0 8px 24px var(--exe-glow)}
.btn-slate{background:var(--surface-2);border-color:var(--line-strong);color:var(--fg)}
.btn-slate:hover:not(:disabled){border-color:var(--accent);background:var(--surface-solid)}
.btn-soft-ok{background:var(--ok-soft);border-color:rgba(16,185,129,.28);color:var(--ok)}
.btn-soft-ok:hover:not(:disabled){border-color:var(--ok);box-shadow:0 4px 14px var(--ok-soft)}
.btn-soft-warn{background:var(--exe-soft);border-color:rgba(245,158,11,.32);color:var(--exe)}
.btn-soft-warn:hover:not(:disabled){border-color:var(--exe)}
.btn-soft-pause{background:var(--pause-soft);border-color:rgba(124,58,237,.28);color:var(--pause)}
.btn-soft-pause:hover:not(:disabled){border-color:var(--pause)}
.btn-soft-block{background:var(--block-soft);border-color:rgba(225,29,72,.28);color:var(--block)}
.btn-soft-block:hover:not(:disabled){border-color:var(--block)}
.btn-soft-accent{background:var(--accent-soft);border-color:rgba(8,145,178,.28);color:var(--accent)}
.btn-soft-accent:hover:not(:disabled){border-color:var(--accent)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn-ghost:hover:not(:disabled){background:var(--surface-2);color:var(--fg);border-color:transparent;transform:none;box-shadow:none}
.btn-sm{padding:6px 13px;font-size:12.5px}
.btn-xs{padding:4px 10px;font-size:12px}

/* === STATUS PILLS === */
.st-pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:700;white-space:nowrap}
.st-pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-pill.nob::before{display:none}
.st-verificado,.st-resolvido{background:var(--ok-soft);color:var(--ok)}
.st-revisado{background:var(--rev-soft);color:var(--rev)}
.st-executado,.st-aguarda,.st-em_analise{background:var(--exe-soft);color:var(--exe)}
.st-aguardando_decisao{background:var(--pause-soft);color:var(--pause)}
.st-em_curso,.st-parcial{background:var(--run-soft);color:var(--run)}
.st-bloqueado,.st-correcao_solicitada,.st-aberto{background:var(--block-soft);color:var(--block)}
.st-pendente,.st-descartado{background:var(--wait-soft);color:var(--wait)}
.st-code{background:var(--pause-soft);color:var(--pause)}
.st-accent{background:var(--accent-soft);color:var(--accent)}
.code-tag{font:600 11.5px var(--f-mono);color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:2px 7px;white-space:nowrap}

/* === MENU "⋯" === */
.menu-wrap{position:relative;display:inline-flex}
.menu-pop{position:absolute;right:0;top:calc(100% + 5px);z-index:60;min-width:210px;background:var(--surface-solid);border:1px solid var(--line-strong);border-radius:14px;padding:6px;box-shadow:var(--shadow-lg);display:grid;gap:2px}
.menu-item{border:0;background:transparent;text-align:left;padding:8px 11px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px;color:var(--fg)}
.menu-item:hover{background:var(--surface-2)}
.menu-item.danger{color:var(--block)}
.menu-sep{height:1px;background:var(--line);margin:4px 0}

/* === CARDS GLASSMÓRFICOS === */
.card{background:var(--surface);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:18px;padding:20px 22px;box-shadow:var(--shadow);display:grid;gap:14px;min-width:0}
.alert-strip{background:var(--block-soft);border:1px solid var(--block);color:var(--fg);border-radius:13px;padding:12px 15px;font-size:13.5px}

/* === HOME (AGORA) — ESTILO HERO IMAGE (3 CARTÕES LUMINOSOS + SIDEBAR) === */
.home-shell{display:grid;grid-template-columns:270px minmax(0,1fr);gap:22px;align-items:start}
.home-sidebar{background:var(--surface);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:20px;padding:18px 16px;box-shadow:var(--shadow);display:grid;gap:16px;position:sticky;top:74px;max-height:calc(100vh - 92px);overflow-y:auto;min-width:0}
.sb-group-brand{display:flex;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.sb-group-logo{width:52px;height:52px;border-radius:14px;object-fit:cover;border:1.5px solid var(--accent-glow);box-shadow:0 0 18px var(--accent-soft);flex:0 0 auto;background:#021324}
.sb-sec{display:grid;gap:6px}
.sb-sec-lbl{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:0 6px}
.sb-nav-btn{border:1px solid transparent;background:transparent;border-radius:11px;padding:8px 11px;text-align:left;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;font-weight:600;color:var(--fg);transition:all .14s;width:100%}
.sb-nav-btn:hover{background:var(--surface-2);border-color:var(--line)}
.sb-area-btn{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:9px 11px;text-align:left;cursor:pointer;display:grid;gap:4px;transition:all .15s;width:100%}
.sb-area-btn:hover{border-color:var(--accent);background:var(--surface-solid);box-shadow:0 4px 14px var(--accent-soft)}
.sb-area-btn.is-current{border:1.5px solid var(--accent);background:linear-gradient(135deg,var(--accent-soft),var(--surface-solid));box-shadow:0 0 18px var(--accent-soft)}
.sb-area-top{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);font-weight:700}
.sb-area-title{font-size:13px;font-weight:700;line-height:1.3;color:var(--fg)}
.home-content{display:grid;gap:22px;min-width:0}

/* HERO VIVO EM 3 PILARES CONECTADOS (EXATAMENTE COMO A FIGURA DO README!) */
.hero-header{text-align:center;display:grid;gap:6px;padding:4px 8px 2px}
.hero-header-brand{display:inline-flex;align-items:center;justify-content:center;gap:11px;margin:0 auto}
.hero-header h1{font:800 24px/1.2 var(--f-display);letter-spacing:-.025em}
.hero-header p{font-size:13.5px;color:var(--muted);max-width:720px;margin:0 auto}

.trio-stage{display:grid;grid-template-columns:minmax(0,1fr) 30px minmax(0,1.22fr) 30px minmax(0,1fr);align-items:stretch;gap:6px;padding-top:14px}
.trio-arrow{display:flex;align-items:center;justify-content:center;color:var(--accent);opacity:.9}
.trio-arrow.ok{color:var(--ok)}

.glow-card{position:relative;background:var(--surface);backdrop-filter:blur(12px);border-radius:20px;padding:26px 18px 18px;display:grid;gap:13px;align-content:space-between;transition:transform .16s, box-shadow .16s;min-width:0}
.glow-card.c-cyan{border:1.5px solid var(--accent-glow);box-shadow:var(--shadow-cyan)}
.glow-card.c-center{border:2px solid var(--ok);box-shadow:var(--shadow-ok);background:linear-gradient(180deg, var(--ok-soft) 0%, var(--surface) 30%, var(--surface) 100%)}
.glow-card.c-ok{border:1.5px solid var(--ok-glow);box-shadow:var(--shadow-ok)}
.glow-card:hover{transform:translateY(-2px)}

/* Pílula flutuante no topo do cartão (assinatura da figura!) */
.pill-crest{position:absolute;top:-14px;left:50%;transform:translateX(-50%);border-radius:999px;padding:5px 15px;font:800 11.5px/1 var(--f-display);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.22)}
.pill-crest.c-cyan{background:linear-gradient(135deg, #38bdf8, #06b6d4);color:#031521}
.pill-crest.c-center{background:linear-gradient(135deg, #22d3ee, #34d399);color:#031521}
.pill-crest.c-ok{background:linear-gradient(135deg, #34d399, #10b981);color:#031521}

.mini-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mini-tile{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:9px 7px;text-align:center;display:grid;gap:2px}
.mini-tile b{font:800 15px var(--f-display);color:var(--accent)}
.mini-tile span{font-size:11px;color:var(--muted);font-weight:600}

.hero-btn-stack{display:grid;gap:8px}
.hero-btn-stack .btn{width:100%;padding:9px 14px;font-size:13.5px}
.hero-btn-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* Mini trilha luminosa de fases no Cartão 3 */
.phase-rail-mini{display:flex;align-items:center;justify-content:center;gap:5px;flex-wrap:wrap;padding:6px 0}
.phase-dot-btn{display:inline-flex;align-items:center;justify-content:center;min-width:38px;height:36px;padding:0 8px;border-radius:11px;border:1.5px solid var(--line-strong);background:var(--surface-2);color:var(--muted);font:800 12px var(--f-display);cursor:pointer;transition:all .14s}
.phase-dot-btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
.phase-dot-btn.is-done{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);box-shadow:0 0 14px var(--ok-soft)}
.phase-dot-btn.is-cur{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);box-shadow:0 0 16px var(--accent-glow)}
.phase-sep{color:var(--muted);font-weight:700;font-size:12px}

.bar-slim{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;display:flex;border:1px solid var(--line)}
.bar-slim i{display:block;height:100%}
.action-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Fila de decisão */
.queue-card{background:var(--surface);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.queue-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.qrows{display:grid}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line);transition:background .12s}
.qrow:last-child{border-bottom:0}
.qrow:hover{background:var(--surface-2)}
.qrow-main{display:grid;gap:5px;min-width:0}
.qrow-title{font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;line-height:1.35}
.qrow-sub{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.qrow-actions{display:flex;align-items:center;gap:7px;flex-shrink:0}

.bottom-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.compact-list{display:grid;gap:8px}
.compact-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 13px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-size:13px}
.compact-row.is-block{border-left:3.5px solid var(--block)}

/* === ABA PROJETO — MAPA ARCHIFY LEGÍVEL + LOCALIZADOR ONDE ESTOU === */
.canvas-shell{display:grid;gap:14px}
.canvas-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:15px;padding:10px 15px;box-shadow:var(--shadow)}
.canvas-bar-group{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.search-in{border:1px solid var(--line-strong);background:var(--surface-2);border-radius:999px;padding:6px 14px;font-size:13px;width:210px}
.search-in:focus{border-color:var(--accent);outline:none;background:var(--surface-solid)}

.workspace-split{position:relative;display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start}
.workspace-split.with-inspector{grid-template-columns:minmax(0,1fr) 380px}

.arch-viewport{position:relative;background-color:var(--bg);background-image:radial-gradient(var(--canvas-dot) 1.25px, transparent 1.25px);background-size:20px 20px;border:1.5px solid var(--line);border-radius:20px;overflow:auto;min-height:540px;max-height:76vh;padding:22px;box-shadow:inset 0 0 36px var(--accent-soft)}
.arch-world{position:relative;display:inline-flex;gap:24px;align-items:flex-start;transform-origin:0 0;min-width:max-content;padding:6px 12px 42px 6px}
svg.arch-svg{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:visible}
svg.arch-svg path{fill:none;transition:opacity .18s,stroke .18s,stroke-width .18s}
svg.arch-svg path.e-seq{stroke:var(--edge);stroke-width:1.75}
svg.arch-svg path.e-block{stroke:var(--block);stroke-width:2.25;stroke-dasharray:6 4}
svg.arch-svg path.e-hot-up{stroke:var(--accent);stroke-width:2.8;stroke-dasharray:none}
svg.arch-svg path.e-hot-down{stroke:var(--exe);stroke-width:2.8;stroke-dasharray:none}
svg.arch-svg path.e-hot-block{stroke:var(--block);stroke-width:3;stroke-dasharray:none}
svg.arch-svg path.e-dim{opacity:.14}

.lane{position:relative;z-index:2;width:272px;flex:0 0 auto;display:grid;gap:14px}
.lane-head{background:var(--surface-solid);border:1.5px solid var(--line);border-radius:15px;padding:12px 14px;cursor:pointer;display:grid;gap:5px;box-shadow:var(--shadow);transition:all .16s;text-align:left}
.lane-head:hover{border-color:var(--accent)}
.lane-head.is-current{border:2px solid var(--accent);background:linear-gradient(135deg, var(--accent-soft), var(--surface-solid));box-shadow:0 0 0 3px var(--accent-soft), var(--shadow-cyan)}
.lane-head-top{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);font-weight:700}
.lane-title{font:700 14.5px/1.3 var(--f-display)}
.here-badge{display:inline-flex;align-items:center;gap:4px;background:linear-gradient(135deg, var(--accent-hi), var(--ok-hi));color:#031521;border-radius:999px;padding:2px 9px;font-size:10.5px;font-weight:800;letter-spacing:.02em;white-space:nowrap}

.mod-node{position:relative;background:var(--surface-solid);border:1.5px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);display:grid;gap:10px;transition:all .15s}
.mod-node::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--node-accent,var(--wait))}
.mod-node:hover{border-color:var(--line-strong);transform:translateY(-1px)}
.mod-node.is-final{box-shadow:0 0 0 1.5px var(--accent), var(--shadow-cyan)}
.mod-node.is-dim{opacity:.24}
.mod-node.is-hot{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft), var(--shadow)}
.mod-node.is-selected{border:2px solid var(--accent);background:linear-gradient(180deg, var(--accent-soft) 0%, var(--surface-solid) 38%);box-shadow:0 0 0 4px var(--accent-soft), var(--shadow-cyan)}
.mod-node.st-n-verificado{--node-accent:var(--ok)}
.mod-node.st-n-aguarda{--node-accent:var(--exe)}
.mod-node.st-n-em_curso{--node-accent:var(--run)}
.mod-node.st-n-bloqueado{--node-accent:var(--block)}
.mod-node.st-n-pendente,.mod-node.st-n-parcial{--node-accent:var(--wait)}

.mod-head-btn{background:none;border:0;padding:0;text-align:left;cursor:pointer;display:grid;gap:6px;width:100%}
.mod-meta{display:flex;justify-content:space-between;align-items:center;gap:6px}
.mod-title{font:700 14px/1.35 var(--f-display)}

.stages-wrap{display:grid;gap:9px;padding-top:10px;border-top:1px dashed var(--line)}
.st-card{background:var(--surface-2);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:7px;cursor:pointer;transition:all .14s}
.st-card:hover{border-color:var(--accent)}
.st-card.is-sel{border:2px solid var(--accent);background:var(--surface-solid);box-shadow:0 0 0 3px var(--accent-soft), var(--shadow-cyan)}
.st-card.is-here{border:2px solid var(--ok);background:linear-gradient(135deg, var(--ok-soft), var(--surface-solid));box-shadow:0 0 0 4px var(--ok-soft)}
.st-card-top{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:nowrap}
.st-card-top .st-pill{font-size:10.5px;padding:2px 7px;white-space:nowrap}
.st-card-title{font-size:13px;font-weight:600;line-height:1.38}

.st-preview{display:grid;gap:7px;padding-top:8px;border-top:1px solid var(--line);font-size:12px;line-height:1.45}
.st-preview-meta{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;color:var(--muted);font-weight:600}
.st-preview-crit{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:7px 9px;color:var(--fg);overflow-wrap:anywhere}

/* === INSPETOR LATERAL DIREITO === */
.inspector{background:var(--surface);backdrop-filter:blur(12px);border:1.5px solid var(--line);border-radius:18px;padding:18px 20px;box-shadow:var(--shadow-lg);display:grid;gap:14px;max-height:76vh;overflow-y:auto;position:sticky;top:74px;min-width:0}
.ins-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;border-bottom:1px solid var(--line);padding-bottom:12px}
.ins-sec{display:grid;gap:7px;font-size:13.5px;min-width:0}
.ins-sec h4{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.ins-box{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px;min-width:0;overflow-wrap:anywhere;word-break:break-word}
.check-list{display:grid;gap:7px;margin:0;padding:0;list-style:none}
.check-item{display:flex;gap:8px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.45}
.check-ic{color:var(--ok);font-weight:800;flex:0 0 auto;margin-top:1px}
details.clean-fold{border:1px solid var(--line);border-radius:11px;padding:8px 11px;background:var(--surface-2)}
details.clean-fold summary{cursor:pointer;font-size:12.5px;font-weight:700;color:var(--accent);list-style:none;display:flex;align-items:center;justify-content:space-between}
details.clean-fold[open] summary{margin-bottom:8px}

/* === REVISÃO CONTEXTUAL === */
.rev-grid{display:grid;grid-template-columns:minmax(0,1fr) 365px;gap:18px;align-items:start}
.rev-rail{position:sticky;top:74px;background:var(--surface);backdrop-filter:blur(12px);border:1.5px solid var(--ok-glow);border-radius:18px;padding:20px;box-shadow:var(--shadow-ok);display:grid;gap:13px;min-width:0}
.ev-stage{border:1px solid var(--line);background:var(--surface-2);border-radius:14px;padding:14px;display:grid;gap:10px;overflow-x:auto}
.ev-img{max-width:100%;max-height:520px;object-fit:contain;border-radius:10px;background:#fff;border:1px solid var(--line);cursor:zoom-in}
.ev-table-wrap{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface-solid)}
.ev-table{border-collapse:collapse;width:100%;font-size:12.5px;font-family:var(--f-mono)}
.ev-table th,.ev-table td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.ev-table th{position:sticky;top:0;background:var(--surface-2);font-weight:700}
.ev-md{font-size:14px;line-height:1.6;display:grid;gap:8px}
.ev-md pre{background:var(--surface-solid);border:1px solid var(--line);border-radius:9px;padding:10px;overflow-x:auto;margin:0}
.ev-md ul{margin:0;padding-left:18px}

/* === ABA HARNESS & AGENTE === */
.harness-hero{background:linear-gradient(135deg, var(--surface) 0%, var(--surface) 56%, var(--accent-soft) 100%);border:1.5px solid var(--accent-glow);border-radius:20px;padding:22px 24px;box-shadow:var(--shadow-cyan);display:grid;gap:16px}
.stat-pills{display:flex;flex-wrap:wrap;gap:8px}
.stat-chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-solid);border:1px solid var(--line-strong);border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:700;cursor:pointer;transition:all .14s}
.stat-chip:hover{border-color:var(--accent);transform:translateY(-1px)}
.stat-chip.is-active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);box-shadow:0 0 14px var(--accent-soft)}

.arch-pillars{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.pillar-card{background:var(--surface-solid);border:1.5px solid var(--line);border-radius:15px;padding:13px;text-align:left;cursor:pointer;display:grid;gap:4px;position:relative;transition:all .14s;box-shadow:var(--shadow)}
.pillar-card::before{content:"";position:absolute;top:0;left:12px;right:12px;height:3px;border-radius:0 0 3px 3px;background:var(--pc,var(--accent))}
.pillar-card:hover,.pillar-card.is-active{border-color:var(--pc,var(--accent));transform:translateY(-2px);box-shadow:0 0 18px var(--accent-soft), var(--shadow)}
.pillar-ic{font-size:17px}
.pillar-t{font:700 13px/1.25 var(--f-display)}
.pillar-s{font-size:11.5px;color:var(--muted)}

.entity-section{background:var(--surface);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:18px;padding:20px 22px;box-shadow:var(--shadow);display:grid;gap:14px}
.entity-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px}
.entity-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.entity-card{background:var(--surface-2);border:1px solid var(--line);border-top:3px solid var(--ec,var(--accent));border-radius:14px;padding:14px 15px;display:grid;gap:7px;align-content:start;min-width:0;overflow-wrap:anywhere}
.entity-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.entity-name{font:700 13.5px/1.3 var(--f-display)}
.entity-desc{font-size:12.5px;line-height:1.45;color:var(--fg)}
.entity-foot{display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding-top:4px}

.flow-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:12px}
.flow-phase{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:13px;display:grid;gap:9px;align-content:start}
.flow-mod{background:var(--surface-solid);border:1px solid var(--line);border-radius:11px;padding:10px 11px;display:grid;gap:5px;cursor:pointer;transition:all .13s;text-align:left;width:100%}
.flow-mod:hover{border-color:var(--accent)}

.agent-shell{display:grid;grid-template-columns:280px minmax(0,1fr);gap:18px;align-items:start}
.agent-rail{background:var(--surface);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);display:grid;gap:10px;max-height:78vh;overflow-y:auto;position:sticky;top:74px;min-width:0}
.rail-phase{display:grid;gap:4px}
.rail-phase-lbl{font-size:11px;font-weight:700;color:var(--muted);padding:6px 6px 2px;letter-spacing:.02em}
.rail-item{border:1px solid transparent;background:transparent;border-radius:10px;padding:8px 10px;text-align:left;cursor:pointer;display:grid;gap:3px;transition:all .12s;width:100%;min-width:0}
.rail-item:hover{background:var(--surface-2);border-color:var(--line)}
.rail-item.is-active{background:var(--accent-soft);border-color:var(--accent)}
.rail-item-title{font-size:13px;font-weight:600;line-height:1.35}
.agent-main{display:grid;gap:16px;min-width:0}
.agent-canvas{position:relative;background-color:var(--bg);background-image:radial-gradient(var(--canvas-dot) 1.25px, transparent 1.25px);background-size:20px 20px;border:1.5px solid var(--line);border-radius:18px;padding:16px;overflow:hidden}
.layer-grid{position:relative;display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:18px;z-index:2}
.layer-node{background:var(--surface-solid);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;text-align:left;display:grid;gap:4px;box-shadow:var(--shadow);transition:all .14s;position:relative;min-width:0}
.layer-node::before{content:"";position:absolute;top:0;left:12px;right:12px;height:3px;border-radius:0 0 3px 3px;background:var(--layer-c,var(--accent))}
.layer-node:hover{border-color:var(--accent);transform:translateY(-1px)}
.layer-node.open{border-color:var(--accent);background:linear-gradient(135deg, var(--accent-soft), var(--surface-solid));box-shadow:0 0 18px var(--accent-soft)}
.clean-list{margin:0;padding-left:18px;display:grid;gap:6px}
.chip-row{display:flex;flex-wrap:wrap;gap:6px}
.file-chip{display:inline-flex;align-items:center;gap:5px;background:var(--surface-solid);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;max-width:100%}
.file-chip.is-btn{cursor:pointer}
.file-chip.is-btn:hover{border-color:var(--accent);color:var(--accent)}
.lineage{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lin-node{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12.5px}

/* === ABA BUGS & MELHORIAS (TRIAGEM PARA AGENTES) === */
.bugs-grid{display:grid;grid-template-columns:390px minmax(0,1fr);gap:20px;align-items:start}
.bug-card{background:var(--surface);backdrop-filter:blur(10px);border:1px solid var(--line);border-left:4px solid var(--bc,var(--exe));border-radius:16px;padding:16px 18px;box-shadow:var(--shadow);display:grid;gap:10px}
.bug-card.sev-critico{--bc:var(--block)}
.bug-card.sev-alto{--bc:#f97316}
.bug-card.sev-medio{--bc:var(--exe)}
.bug-card.sev-baixo{--bc:var(--accent)}
.bug-agent-box{background:linear-gradient(135deg, var(--ok-soft), var(--surface-2));border:1px solid var(--ok-glow);border-radius:11px;padding:10px 12px;font-size:12.5px;display:grid;gap:4px}

/* === MODAIS, TOAST E FORMULÁRIOS === */
.input,.textarea,.select{width:100%;border:1px solid var(--line-strong);background:var(--surface-2);border-radius:11px;padding:9px 12px;font-size:13.5px}
.input:focus,.textarea:focus,.select:focus{border-color:var(--accent);outline:none;background:var(--surface-solid)}
.textarea{min-height:80px;resize:vertical}
.field-lbl{font-size:12px;font-weight:700;color:var(--muted);display:grid;gap:5px}
.modal-bg{position:fixed;inset:0;background:rgba(2,6,23,.62);backdrop-filter:blur(6px);z-index:70;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-box{background:var(--surface-solid);border:1.5px solid var(--line-strong);border-radius:20px;padding:24px;max-width:540px;width:100%;max-height:90vh;overflow-y:auto;display:grid;gap:14px;box-shadow:var(--shadow-lg)}
.toast{position:fixed;right:20px;bottom:20px;z-index:90;background:var(--surface-solid);border:1.5px solid var(--accent);border-radius:14px;padding:11px 16px;box-shadow:var(--shadow-cyan);font-size:13.5px;font-weight:700;max-width:440px}
.toast.err{border-color:var(--block);color:var(--block)}
.lightbox{position:fixed;inset:0;background:rgba(2,6,23,.88);z-index:95;display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
.lightbox img{max-width:95vw;max-height:92vh;background:#fff;border-radius:12px}

/* === RESPONSIVO === */
@media (max-width:1180px){
  .nav{flex-wrap:wrap}
  .home-shell,.workspace-split.with-inspector,.rev-grid,.agent-shell,.bugs-grid{grid-template-columns:minmax(0,1fr)}
  .home-sidebar,.inspector,.rev-rail,.agent-rail{position:static;max-height:none}
  .trio-stage{grid-template-columns:minmax(0,1fr);gap:24px}
  .trio-arrow{display:none}
  .arch-pillars{grid-template-columns:repeat(3,minmax(0,1fr))}
  .layer-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:760px){
  .bottom-two,.layer-grid,.arch-pillars,.hero-btn-pair{grid-template-columns:minmax(0,1fr)}
  .qrow{grid-template-columns:minmax(0,1fr);gap:8px}
  .arch-world{flex-direction:column;gap:20px;min-width:0;width:100%;padding:4px}
  .lane{width:100%}
  .proj-title{max-width:160px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>

<body>

  function renderMarkdownSafe(md){
    const lines = String(md || '').split(/\r?\n/);
    let html = '', inCode = false, inList = false;
    const inl = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    for (const raw of lines) {
      if (raw.trim().startsWith('```')) {
        if (inList) { html += '</ul>'; inList = false; }
        html += inCode ? '</code></pre>' : '<pre><code>';
        inCode = !inCode; continue;
      }
      if (inCode) { html += esc(raw) + '\n'; continue; }
      const t = raw.trim();
      if (!t) { if (inList) { html += '</ul>'; inList = false; } continue; }
      const hm = t.match(/^(#{1,4})\s+(.*)$/);
      if (hm) { if (inList) { html += '</ul>'; inList = false; } html += `<h${Math.min(4, hm[1].length + 1)}>${inl(hm[2])}</h${Math.min(4, hm[1].length + 1)}>`; }
      else if (/^[-*]\s+/.test(t)) { if (!inList) { html += '<ul>'; inList = true; } html += `<li>${inl(t.replace(/^[-*]\s+/, ''))}</li>`; }
      else { if (inList) { html += '</ul>'; inList = false; } html += `<p>${inl(t)}</p>`; }
    }
    if (inList) html += '</ul>';
    if (inCode) html += '</code></pre>';
    return html || '<p class="muted">(vazio)</p>';
  }

    return `<div class="main full-bleed">

            <div class="trio-stage">

                  <div class="mini-tile"><b>${(D.harness_resumo && D.harness_resumo.contadores && D.harness_resumo.contadores.hooks_codigo) || 1}</b><span>Travas</span></div>

          <section class="queue-card" id="sec-fila" aria-label="Entregas aguardando decisão">
            <div class="queue-head">
              <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
                <h3>Aguardando sua decisão</h3>
                <div class="seg-tabs">
                  <button type="button" class="seg-tab" data-qfilter="pendentes" aria-selected="${UI.queueFilter === 'pendentes' ? 'true' : 'false'}">Marcos (${filaBloq.length})</button>
                  ${filaTodas.length !== filaBloq.length ? `<button type="button" class="seg-tab" data-qfilter="todas" aria-selected="${UI.queueFilter === 'todas' ? 'true' : 'false'}">Todas (${filaTodas.length})</button>` : ''}
                  <button type="button" class="seg-tab" data-qfilter="aguardando" aria-selected="${UI.queueFilter === 'aguardando' ? 'true' : 'false'}">Em espera (${nPause})</button>
                  <button type="button" class="seg-tab" data-qfilter="bloqueadas" aria-selected="${UI.queueFilter === 'bloqueadas' ? 'true' : 'false'}">Pausadas (${nBlk})</button>

              ${listItems.length ? listItems.map(({item, pair}, idx) => {

                  ${b.origem_id ? `<button type="button" class="btn btn-xs" data-open-review="${esc(b.origem_id)}">Abrir</button>` : ''}

                ${(P.pendencias_humanas || []).slice(0, 4).map(ph => `<div class="compact-row">
                  <div class="wrap-any"><b>${esc(ph.id)}</b> · ${esc(ph.texto)}${ph.bloqueia ? `<div class="muted" style="font-size:12px">Libera: ${esc(ph.bloqueia)}</div>` : ''}</div>

                ${!bloqs.length && !(P.pendencias_humanas || []).length ? '<p class="muted">Nenhum ponto travado fora da fila acima.</p>' : ''}

  // ==================== ABA 2: PROJETO ====================
  function getConnectedModSet(modId){
    const up = new Set(), down = new Set();
    if (!modId) return {up, down};
    for (const r of (D.relacoes_mapa || [])) {
      if (r.para === modId) up.add(r.de);
      if (r.de === modId) down.add(r.para);
    }
    return {up, down};
  }

  function renderInspector(){
    if (!UI.selectedStageId && !UI.selectedModId) return '';
    if (UI.selectedStageId) {
      const pair = findStage(UI.selectedStageId);
      if (!pair) return '';
      const {m, e} = pair;
      const evs = (e._snapshot && e._snapshot.evidencias) || [];
      const curLoc = getWhereAmI();
      const isHere = curLoc.stageId === e.id;
      return `<aside class="inspector" aria-label="Detalhes da etapa">
        <div class="ins-head">
          <div class="wrap-any">
            <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
              <span class="code-tag">${esc(e.id)}</span>
              ${isHere ? '<span class="here-badge">📍 Você está aqui</span>' : ''}
            </div>
            <h3 style="margin-top:7px;font-size:16px;line-height:1.3">${esc(e.titulo)}</h3>
            <div class="muted" style="font-size:12px;margin-top:3px">${esc(m.titulo)}</div>
          </div>
          <button type="button" class="icon-btn" id="btn-close-ins" title="Fechar">×</button>
        </div>

        <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
          <span class="st-pill st-${esc(e._status)}">${esc(ST_LABEL[e._status] || e._status)}</span>
          ${e._eh_marco ? '<span class="st-pill st-executado nob">★ Marco principal</span>' : ''}
          ${e._exp ? '<span class="st-pill st-bloqueado">Arquivo alterado</span>' : ''}
        </div>

        <div class="action-bar">
          <button type="button" class="btn btn-accent btn-sm" data-open-review="${esc(e.id)}">Revisar evidências</button>
          ${canWrite() && e._status !== 'verificado' && ['executado','revisado','aguardando_decisao','correcao_solicitada'].includes(e._status)
            ? `<button type="button" class="btn btn-ok btn-sm" data-act="verificado" data-sid="${esc(e.id)}">✓ Aprovar</button>` : ''}
          ${renderRowActions(e, 'ins-' + e.id).replace(/<button[^>]*data-open-review[^>]*>Revisar<\/button>/, '').replace(/<button[^>]*data-act="verificado"[^>]*>✓ Aprovar<\/button>/, '')}
        </div>

        <div class="ins-sec">
          <h4>Resumo da entrega</h4>
          <p style="font-size:13.5px;line-height:1.5">${esc(e.afirmacao || e.descricao || 'Etapa planejada aguardando execução.')}</p>
        </div>

        <div class="ins-sec">
          <h4>Como conferir</h4>
          <div class="check-item"><span class="check-ic">✓</span><span>${esc(e.verificacao || 'Conferir arquivos anexados abaixo.')}</span></div>
        </div>

        <div class="ins-sec">
          <h4>Evidências (${evs.length})</h4>
          ${evs.length ? `<div class="chip-row">${evs.map((ev, i) => `<button type="button" class="file-chip is-btn" data-open-review-ev="${esc(e.id)}" data-ev-open-idx="${i}" title="${esc(ev.ref)}">📄 ${esc(baseName(ev.ref))} ${ev.estado === 'ok' ? '✓' : '!'}</button>`).join('')}</div>` : '<span class="muted">Nenhum arquivo anexado ainda.</span>'}
        </div>

        ${(e._regs || []).length ? `<details class="clean-fold">
          <summary>Histórico de decisões (${e._regs.length}) ▾</summary>
          <div style="display:grid;gap:6px;font-size:12.5px">
            ${e._regs.slice().reverse().map(r => `<div><b>${esc(ST_LABEL[r.nivel] || r.acao || r.nivel)}</b> · ${esc(r.revisor)} <span class="muted">(${esc(r.data)})</span>${r.nota ? `<div class="muted">${esc(r.nota)}</div>` : ''}</div>`).join('')}
          </div>
        </details>` : ''}
      </aside>`;
    }

    const mod = findMod(UI.selectedModId);
    if (!mod) return '';
    const ct = mod.contrato || {};
    const crits = ct.criterios_aceitacao || [];
    const canLock = !ct.hash && ct.pergunta && crits.length && ct.criterio_abandono;
    const ets = mod.etapas || [];
    return `<aside class="inspector" aria-label="Detalhes do bloco">
      <div class="ins-head">
        <div class="wrap-any">
          <span class="code-tag">${esc(mod.id)}${mod._eh_marco ? ' · ★ Marco' : ''}</span>
          <h3 style="margin-top:7px;font-size:16px;line-height:1.3">${esc(mod.titulo)}</h3>

  function drawArchEdges(){
    const svg = document.getElementById('arch-svg');
    const world = document.getElementById('arch-world');
    if (!svg || !world) return;
    const z = UI.zoom || 1;
    const wr = world.getBoundingClientRect();
    svg.setAttribute('width', world.scrollWidth);
    svg.setAttribute('height', world.scrollHeight);

    const activeMod = UI.hoverModId || UI.selectedModId;
    const isMobile = window.innerWidth <= 760;
    let defs = `<defs>
      <marker id="ar-seq" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="var(--edge)"/></marker>
      <marker id="ar-blk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="var(--block)"/></marker>
      <marker id="ar-up"  viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="var(--accent)"/></marker>
      <marker id="ar-dn"  viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="var(--exe)"/></marker>
    </defs>`;

    let paths = '';
    for (const rel of (D.relacoes_mapa || [])) {
      const elA = document.getElementById('node-mod-' + rel.de);
      const elB = document.getElementById('node-mod-' + rel.para);
      if (!elA || !elB) continue;
      const A = elA.getBoundingClientRect(), B = elB.getBoundingClientRect();
      const axL = (A.left - wr.left) / z, axR = (A.right - wr.left) / z, axC = (axL + axR) / 2;
      const ayT = (A.top - wr.top) / z, ayB = (A.bottom - wr.top) / z, ayC = (ayT + ayB) / 2;
      const bxL = (B.left - wr.left) / z, bxR = (B.right - wr.left) / z, bxC = (bxL + bxR) / 2;
      const byT = (B.top - wr.top) / z, byB = (B.bottom - wr.top) / z, byC = (byT + byB) / 2;

      let d = '';
      if (isMobile || Math.abs(axC - bxC) < 40) {
        const x1 = axC, y1 = ayB + 2, x2 = bxC, y2 = byT - 4, my = (y1 + y2) / 2;
        d = `M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}`;
      } else if (bxL >= axR - 6) {
        const span = bxL - axR;
        if (span > 140) {
          const x1 = axC, y1 = ayB + 2, x2 = bxL - 4, y2 = byC, lowY = Math.max(ayB, byB) + 26;
          d = `M${x1},${y1} C${x1},${lowY} ${x2 - 54},${lowY} ${x2},${y2}`;
        } else {
          const x1 = axR + 2, y1 = ayC, x2 = bxL - 4, y2 = byC, dx = Math.max(24, span * 0.5);
          d = `M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}`;
        }
      } else {
        const x1 = axR + 2, y1 = ayC, x2 = bxR + 4, y2 = byC, cx = Math.max(x1, x2) + 28;
        d = `M${x1},${y1} C${cx},${y1} ${cx},${y2} ${x2},${y2}`;
      }
      const isBlk = rel.ativa || rel.tipo === 'bloqueante';
      let cls = isBlk ? 'e-block' : 'e-seq', mk = isBlk ? 'ar-blk' : 'ar-seq';
      if (activeMod) {
        if (rel.para === activeMod) { cls = isBlk ? 'e-hot-block' : 'e-hot-up'; mk = isBlk ? 'ar-blk' : 'ar-up'; }
        else if (rel.de === activeMod) { cls = isBlk ? 'e-hot-block' : 'e-hot-down'; mk = isBlk ? 'ar-blk' : 'ar-dn'; }
        else cls += ' e-dim';
      }
      paths += `<path class="${cls}" d="${d}" marker-end="url(#${mk})"/>`;
    }
    svg.innerHTML = defs + paths;
  }

  function renderEvidenceBody(ev){
    if (!ev) return '<p class="muted">Nenhum arquivo anexado.</p>';
    if (ev.estado === 'ausente') return `<div class="alert-strip">Arquivo não encontrado no disco: <code>${esc(ev.ref)}</code>.</div>`;
    if (ev.estado === 'caminho_invalido') return `<div class="alert-strip">Caminho fora da pasta do projeto: <code>${esc(ev.ref)}</code>.</div>`;
    if (ev.tipo === 'remota') return `<div class="ins-box"><b>Link externo:</b> <a href="${esc(ev.ref)}" target="_blank" rel="noopener">${esc(ev.ref)}</a><div class="muted">${ev.versao ? 'Versão: ' + esc(ev.versao) : 'Alterações externas não são detectadas automaticamente.'}</div></div>`;
    if (ev.tipo === 'referencia_logica') return `<div class="ins-box"><b>Referência:</b> ${esc(ev.ref)} ${esc(ev.descricao || '')}</div>`;

    const meta = `<div class="muted" style="font-size:12px" title="${esc(ev.ref)}">📄 <b>${esc(baseName(ev.ref))}</b> · ${ev.bytes != null ? (ev.bytes / 1024).toFixed(1) + ' KB' : ''} · integridade verificada</div>`;
    if (!D.modo_servidor) return `${meta}<div class="ins-box">Abra pelo servidor local (<code>serve --open</code>) para visualizar figuras, tabelas e relatórios diretamente aqui.</div>`;

    if (ev.midia === 'imagem') {
      const src = '/api/evidencia?ref=' + encodeURIComponent(ev.ref) + '&v=' + encodeURIComponent(ev.sha256 || '');
      return `${meta}<img class="ev-img" src="${src}" alt="${esc(baseName(ev.ref))}" data-zoom-img="${src}">`;
    }
    const cached = UI.reviewEvidenceCache[ev.ref];
    if (!cached || cached.loading) return `${meta}<p class="muted">Carregando visualização...</p>`;
    if (cached.erro) return `${meta}<div class="alert-strip">${esc(cached.erro)}</div>`;
    if (cached.midia === 'tabela') {
      return `${meta}<div class="ev-table-wrap"><table class="ev-table"><thead><tr>${(cached.headers || []).map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${(cached.rows || []).map(r => `<tr>${r.map(v => `<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${cached.truncado ? `<span class="muted" style="font-size:12px">Mostrando as primeiras ${cached.max_linhas} linhas.</span>` : ''}`;
    }
    if (cached.midia === 'markdown') return `${meta}<div class="ev-md">${renderMarkdownSafe(cached.conteudo)}</div>`;
    return `${meta}<pre style="margin:0;overflow:auto;max-height:400px;background:var(--surface-solid);padding:12px;border-radius:10px;border:1px solid var(--line)">${esc(cached.conteudo || '')}</pre>`;
  }

    if (UI.agentView === 'harness') {
      return `<div class="main full-bleed">${modeBar}${renderHarnessOverview()}</div>`;

  function drawAgentEdges(){
    const svg = document.getElementById('agent-svg');
    const box = document.getElementById('agent-canvas');
    if (!svg || !box) return;
    const br = box.getBoundingClientRect();
    svg.setAttribute('width', box.clientWidth);
    svg.setAttribute('height', box.clientHeight);
    const keys = ['contexto', 'componentes', 'guardrails', 'avaliacao'];
    let out = '<defs><marker id="ag-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="var(--accent)"/></marker></defs>';
    for (let i = 0; i < keys.length - 1; i++) {
      const a = document.getElementById('ag-layer-' + keys[i]);
      const b = document.getElementById('ag-layer-' + keys[i + 1]);
      if (!a || !b) continue;
      const A = a.getBoundingClientRect(), B = b.getBoundingClientRect();
      if (B.left >= A.right - 4) {
        const x1 = A.right - br.left + 2, y1 = A.top + A.height / 2 - br.top;
        const x2 = B.left - br.left - 4, y2 = B.top + B.height / 2 - br.top;
        const mx = (x1 + x2) / 2;
        out += `<path class="e-hot-up" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" marker-end="url(#ag-ar)"/>`;
      }
    }
    svg.innerHTML = out;
  }

      focusWhereAmI(b.dataset.jumpPhase, b.dataset.jumpMod || null, null);
    }));
    const bHW = document.getElementById('btn-home-where'); if (bHW) bHW.addEventListener('click', () => focusWhereAmI());
    const bKW = document.getElementById('btn-kpi-where'); if (bKW) bKW.addEventListener('click', () => focusWhereAmI());
    const bWI = document.getElementById('btn-where-am-i'); if (bWI) bWI.addEventListener('click', () => focusWhereAmI());

    // Bugs quick modal & inline form
    const openBugModal = () => { UI.bugModal = true; UI.bugError = ''; render(); setTimeout(() => { const el = document.getElementById('bm-titulo'); if (el) el.focus(); }, 20); };
    const bQB = document.getElementById('btn-quick-bug'); if (bQB) bQB.addEventListener('click', openBugModal);
    const bHB = document.getElementById('btn-home-bug'); if (bHB) bHB.addEventListener('click', openBugModal);
    const bCB = document.getElementById('btn-close-bug'); if (bCB) bCB.addEventListener('click', () => { UI.bugModal = false; render(); });
    const bCnB = document.getElementById('btn-cancel-bug'); if (bCnB) bCnB.addEventListener('click', () => { UI.bugModal = false; render(); });
    const bSBM = document.getElementById('btn-save-bug-modal');
    if (bSBM) bSBM.addEventListener('click', () => submitBugReport({
      tipo: document.getElementById('bm-tipo').value,
      severidade: document.getElementById('bm-sev').value,
      titulo: document.getElementById('bm-titulo').value,
      descricao: document.getElementById('bm-desc').value
    }));
    const bSBI = document.getElementById('btn-submit-bug-inline');
    if (bSBI) bSBI.addEventListener('click', () => submitBugReport({
      tipo: document.getElementById('bf-tipo').value,
      severidade: document.getElementById('bf-sev').value,
      tela_origem: document.getElementById('bf-tela').value,
      etapa_id: document.getElementById('bf-etapa').value,
      titulo: document.getElementById('bf-titulo').value,
      descricao: document.getElementById('bf-desc').value,
      passos: document.getElementById('bf-passos').value,
      reportado_por: document.getElementById('bf-autor').value
    }));
    document.querySelectorAll('[data-bug-filter]').forEach(b => b.addEventListener('click', () => { UI.bugFilter = b.dataset.bugFilter; render(); }));
    document.querySelectorAll('[data-bug-st]').forEach(b => b.addEventListener('click', () => updateBugStatusNow(b.dataset.bugId, b.dataset.bugSt)));
    const bCBP = document.getElementById('btn-copy-bugs-prompt'); if (bCBP) bCBP.addEventListener('click', copyBugsPromptForAgent);

    const qBtn = document.getElementById('btn-toggle-q'); if (qBtn) qBtn.addEventListener('click', () => { UI.showQuestion = !UI.showQuestion; render(); });
    const btnTheme = document.getElementById('btn-theme');
    if (btnTheme) btnTheme.addEventListener('click', () => {
      const next = getCurrentTheme() === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('specboard.theme', next); } catch(e) {}
    });
    const btnRef = document.getElementById('btn-refresh');
    if (btnRef) btnRef.addEventListener('click', async () => {
      const r = await fetch('/api/estado');
      if (r.ok) { D = await r.json(); UI.reviewEvidenceCache = {}; render(); showToast('Painel atualizado.'); }
    });

    const btnRevr = document.getElementById('btn-reviewer'); if (btnRevr) btnRevr.addEventListener('click', () => { UI.reviewerModal = true; render(); });
    const btnCloseRevr = document.getElementById('btn-close-revr'); if (btnCloseRevr) btnCloseRevr.addEventListener('click', () => { UI.reviewerModal = false; render(); });
    const btnSaveRevr = document.getElementById('btn-save-revr');
    if (btnSaveRevr) btnSaveRevr.addEventListener('click', () => { setReviewer(document.getElementById('revr-input').value); UI.reviewerModal = false; render(); showToast('Nome salvo.'); });

    const btnPol = document.getElementById('btn-policy'); if (btnPol) btnPol.addEventListener('click', () => { UI.showPolicyModal = true; UI.policyError = ''; render(); });
    const btnClosePol = document.getElementById('btn-close-pol'); if (btnClosePol) btnClosePol.addEventListener('click', () => { UI.showPolicyModal = false; render(); });
    const btnSavePol = document.getElementById('btn-save-pol');
    if (btnSavePol) btnSavePol.addEventListener('click', async () => {
      const ch = document.querySelector('input[name="pol-m"]:checked');
      const rev = (document.getElementById('pol-rev').value || '').trim();
      const just = (document.getElementById('pol-just').value || '').trim();
      if (!ch || !rev || !just) { UI.policyError = 'Preencha seu nome e o motivo.'; render(); return; }
      setReviewer(rev); UI.policyBusy = true; render();
      const {status, data} = await apiPost('/api/politica', {modo: ch.value, revisor: rev, justificativa: just});
      UI.policyBusy = false;
      if (status === 200 && data.payload) { D = data.payload; UI.showPolicyModal = false; render(); showToast('Regra de aprovação atualizada.'); }
      else { UI.policyError = data.erro || 'Erro ao salvar.'; render(); }
    });

    document.querySelectorAll('[data-toggle-menu]').forEach(b => b.addEventListener('click', ev => {
      ev.stopPropagation();
      const k = b.dataset.toggleMenu;
      UI.openMenuId = UI.openMenuId === k ? null : k;
      render();
    }));
    document.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', ev => { ev.stopPropagation(); triggerAction(b.dataset.sid, b.dataset.act); }));
    document.querySelectorAll('[data-open-review]').forEach(b => b.addEventListener('click', ev => { ev.stopPropagation(); openReview(b.dataset.openReview, b.dataset.qidxBtn !== undefined ? Number(b.dataset.qidxBtn) : null); }));
    document.querySelectorAll('[data-open-review-ev]').forEach(b => b.addEventListener('click', ev => { ev.stopPropagation(); openReview(b.dataset.openReviewEv, null, Number(b.dataset.evOpenIdx || 0)); }));
    document.querySelectorAll('[data-goto-agent]').forEach(b => b.addEventListener('click', ev => { ev.stopPropagation(); jumpToAgent(b.dataset.gotoAgent); }));
    document.querySelectorAll('[data-goto-mod]').forEach(b => b.addEventListener('click', () => {
      const m = findMod(b.dataset.gotoMod);
      if (m) focusWhereAmI(m.fase || '—', m.id, null);
    }));
    document.querySelectorAll('[data-lock-mod]').forEach(b => b.addEventListener('click', () => lockContractNow(b.dataset.lockMod)));

    const closeAct = () => { UI.actionModal = null; render(); };
    const bCA = document.getElementById('btn-close-act'); if (bCA) bCA.addEventListener('click', closeAct);
    const bCnA = document.getElementById('btn-cancel-act'); if (bCnA) bCnA.addEventListener('click', closeAct);
    const bCfA = document.getElementById('btn-confirm-act');
    if (bCfA) bCfA.addEventListener('click', () => {
      const m = UI.actionModal; if (!m) return;
      const revEl = document.getElementById('act-revisor');
      const rev = revEl ? revEl.value.trim() : getReviewer();
      const nota = (document.getElementById('act-nota').value || '').trim();
      if (!rev) { UI.actionError = 'Informe seu nome.'; render(); return; }
      if (m.exigeNota && !nota) { UI.actionError = 'Informe brevemente o motivo.'; render(); return; }
      setReviewer(rev);
      executeAction(m.etapaId, m.acao, rev, nota);
    });

    document.querySelectorAll('[data-qfilter]').forEach(b => b.addEventListener('click', () => { UI.openMenuId = null; UI.queueFilter = b.dataset.qfilter; render(); }));
    const bAllB = document.getElementById('btn-all-bloqs'); if (bAllB) bAllB.addEventListener('click', () => { UI.showAllBlockers = !UI.showAllBlockers; render(); });
    const bVis = document.getElementById('btn-mark-visit');
    if (bVis) bVis.addEventListener('click', async () => {
      if (canWrite()) {
        const {status, data} = await apiPost('/api/visita', {revisor: getReviewer()});
        if (status === 200 && data.payload) { D = data.payload; render(); showToast('Ponto de visita salvo.'); return; }
      }
      try { localStorage.setItem(projectKey('visita'), JSON.stringify({event_ids:(D.eventos || []).map(x => x.id), registrada_em: new Date().toLocaleString('pt-BR')})); } catch(e) {}
      render(); showToast('Ponto de visita salvo.');
    });

    const ps = document.getElementById('proj-search'); if (ps) ps.addEventListener('input', () => { UI.projetoSearch = ps.value; render(); document.getElementById('proj-search').focus(); });
    document.querySelectorAll('[data-pfilter]').forEach(b => b.addEventListener('click', () => { UI.projetoFiltro = b.dataset.pfilter; render(); }));
    const bzOut = document.getElementById('btn-z-out'); if (bzOut) bzOut.addEventListener('click', () => { UI.zoom = Math.max(0.65, +(UI.zoom - 0.1).toFixed(2)); render(); });
    const bzIn = document.getElementById('btn-z-in'); if (bzIn) bzIn.addEventListener('click', () => { UI.zoom = Math.min(1.35, +(UI.zoom + 0.1).toFixed(2)); render(); });
    const bzRes = document.getElementById('btn-z-reset'); if (bzRes) bzRes.addEventListener('click', () => { UI.zoom = 1; UI.hoverModId = null; render(); });
    const bExpAll = document.getElementById('btn-exp-all');
    if (bExpAll) bExpAll.addEventListener('click', () => {
      const mods = D.estado.modulos || [];
      if (UI.expandedModules.size >= mods.length) UI.expandedModules.clear();
      else { fasesList().forEach(f => UI.expandedPhases.add(f)); mods.forEach(m => UI.expandedModules.add(m.id)); }
      render();
    });
    const bPM = document.getElementById('btn-proj-mode'); if (bPM) bPM.addEventListener('click', () => { UI.projetoModo = UI.projetoModo === 'fluxo' ? 'lista' : 'fluxo'; render(); });
    document.querySelectorAll('[data-toggle-phase]').forEach(b => b.addEventListener('click', () => {
      const f = b.dataset.togglePhase;
      if (UI.expandedPhases.has(f)) UI.expandedPhases.delete(f); else UI.expandedPhases.add(f);
      render();
    }));
    document.querySelectorAll('[data-toggle-mod]').forEach(b => b.addEventListener('click', () => {
      const mid = b.dataset.toggleMod;
      if (UI.expandedModules.has(mid)) { UI.expandedModules.delete(mid); if (UI.selectedModId === mid && !UI.selectedStageId) UI.selectedModId = null; }
      else { UI.expandedModules.add(mid); UI.selectedModId = mid; UI.selectedStageId = null; }
      render();
    }));
    document.querySelectorAll('[data-select-stage]').forEach(el => el.addEventListener('click', ev => {
      if (ev.target.closest('button') && !el.matches('button')) return;
      const sid = el.dataset.selectStage, p = findStage(sid);
      if (UI.selectedStageId === sid) UI.selectedStageId = null;
      else { UI.selectedStageId = sid; if (p) { UI.selectedModId = p.m.id; UI.expandedModules.add(p.m.id); } }
      render();
    }));
    const bCI = document.getElementById('btn-close-ins'); if (bCI) bCI.addEventListener('click', () => { UI.selectedStageId = null; UI.selectedModId = null; render(); });

    const bCR = document.getElementById('btn-close-rev'); if (bCR) bCR.addEventListener('click', closeReview);
    document.querySelectorAll('[data-ev-idx]').forEach(b => b.addEventListener('click', () => {
      UI.reviewEvIndex = Number(b.dataset.evIdx);
      const pair = findStage(UI.reviewStageId);
      const ev = pair && pair.e._snapshot && pair.e._snapshot.evidencias[UI.reviewEvIndex];
      render();
      if (ev && ev.estado === 'ok') loadEvidencePreview(ev.ref, ev.midia);
    }));
    document.querySelectorAll('[data-zoom-img]').forEach(img => img.addEventListener('click', () => { UI.lightboxSrc = img.dataset.zoomImg; render(); }));
    const lb = document.getElementById('lightbox'); if (lb) lb.addEventListener('click', () => { UI.lightboxSrc = ''; render(); });

    function readRevForm(){
      const rev = (document.getElementById('rev-revisor') && document.getElementById('rev-revisor').value || '').trim();
      const nota = (document.getElementById('rev-nota') && document.getElementById('rev-nota').value || '').trim();
      return {rev, nota};
    }
    const revAction = (acao, reqNota) => {
      const {rev, nota} = readRevForm();
      if (!rev) { showToast('Informe seu nome antes de salvar.', true); return; }
      if (reqNota && !nota) { showToast('Escreva brevemente o motivo no campo de comentário.', true); return; }
      setReviewer(rev);
      executeAction(UI.reviewStageId, acao, rev, nota);
    };
    const bDA = document.getElementById('btn-dec-aprovar'); if (bDA) bDA.addEventListener('click', () => revAction('verificado', false));
    const bDC = document.getElementById('btn-dec-correcao'); if (bDC) bDC.addEventListener('click', () => revAction('pedir_correcao', true));
    const bDW = document.getElementById('btn-dec-aguardar'); if (bDW) bDW.addEventListener('click', () => revAction('aguardar_decisao', false));
    const bDB = document.getElementById('btn-dec-bloquear'); if (bDB) bDB.addEventListener('click', () => revAction('bloquear', true));
    const bDU = document.getElementById('btn-dec-desbloquear'); if (bDU) bDU.addEventListener('click', () => revAction('desbloquear', false));
    const bDR = document.getElementById('btn-dec-revisado'); if (bDR) bDR.addEventListener('click', () => revAction('revisado', false));
    const bDD = document.getElementById('btn-dec-depois'); if (bDD) bDD.addEventListener('click', closeReview);

    document.querySelectorAll('[data-agent-view]').forEach(b => b.addEventListener('click', () => { UI.agentView = b.dataset.agentView; render(); }));
    document.querySelectorAll('[data-harness-focus]').forEach(b => b.addEventListener('click', () => { UI.harnessFocus = b.dataset.harnessFocus; render(); }));
    const bMS = document.getElementById('btn-mode-stage'); if (bMS) bMS.addEventListener('click', () => { UI.agentView = 'etapa'; render(); });
    document.querySelectorAll('[data-pick-agent-jump]').forEach(b => b.addEventListener('click', () => {
      UI.agentStageId = b.dataset.pickAgentJump; UI.agentView = 'etapa'; UI.agentContextBundle = null; render();
    }));
    document.querySelectorAll('[data-open-mod-agent]').forEach(b => b.addEventListener('click', () => {
      const m = findMod(b.dataset.openModAgent);
      if (m && m.etapas && m.etapas.length) { UI.agentStageId = m.etapas[0].id; UI.agentView = 'etapa'; UI.agentContextBundle = null; render(); }
    }));

    const agS = document.getElementById('agent-search'); if (agS) agS.addEventListener('input', () => { UI.agentSearch = agS.value; render(); document.getElementById('agent-search').focus(); });
    document.querySelectorAll('[data-pick-agent]').forEach(b => b.addEventListener('click', () => { UI.agentStageId = b.dataset.pickAgent; UI.agentContextBundle = null; render(); }));
    document.querySelectorAll('[data-pick-layer]').forEach(b => b.addEventListener('click', () => { UI.agentActiveLayer = b.dataset.pickLayer; render(); }));
    const bAB = document.getElementById('btn-agent-back'); if (bAB) bAB.addEventListener('click', returnFromAgent);
    const bGC = document.getElementById('btn-gen-context');
    if (bGC) bGC.addEventListener('click', async () => {
      const sid = UI.agentStageId; if (!sid) return;
      if (D.modo_servidor) {
        const r = await fetch('/api/contexto/' + encodeURIComponent(sid));
        if (r.ok) { UI.agentContextBundle = await r.json(); render(); return; }
      }
      const p = findStage(sid);
      if (p) { UI.agentContextBundle = {etapa: p.e.id, titulo: p.e.titulo, agente: p.e._agente || {}}; render(); }
    });
  }

  document.addEventListener('click', () => { if (UI.openMenuId) { UI.openMenuId = null; render(); } });
  window.addEventListener('resize', () => {
    if (UI.tab === 'projeto' && UI.projetoModo === 'fluxo' && !UI.reviewStageId) requestAnimationFrame(drawArchEdges);
    if (UI.tab === 'agente' && UI.agentView === 'etapa' && !UI.reviewStageId) requestAnimationFrame(drawAgentEdges);
  });
  document.addEventListener('keydown', ev => {
    if (ev.key === 'Escape') {
      if (UI.lightboxSrc) { UI.lightboxSrc = ''; render(); }
      else if (UI.bugModal) { UI.bugModal = false; render(); }
      else if (UI.actionModal) { UI.actionModal = null; render(); }
      else if (UI.reviewerModal) { UI.reviewerModal = false; render(); }
      else if (UI.showPolicyModal) { UI.showPolicyModal = false; render(); }
      else if (UI.openMenuId) { UI.openMenuId = null; render(); }
      else if (UI.reviewStageId) closeReview();
    }
  });

  try { const th = localStorage.getItem('specboard.theme'); if (th) document.documentElement.setAttribute('data-theme', th); } catch(e) {}
  render();
})();
</script>
</body>
</html>
