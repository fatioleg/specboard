<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SpecBoard</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%230891b2'/%3E%3Cstop offset='100%25' stop-color='%232563eb'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Ctext x='16' y='21' text-anchor='middle' fill='%23fff' font-family='system-ui,sans-serif' font-size='14' font-weight='800'%3ESB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* SpecBoard v2 — Experiência calma, legível e direta (estilo Archify + Linear).
   Gerado a partir de .specboard/estado.json — não edite o HTML gerado. */
:root{
  --bg:#f8fafc; --canvas-dot:rgba(15,23,42,.075);
  --surface:#ffffff; --surface-2:#f1f5f9; --surface-glass:rgba(255,255,255,.9);
  --fg:#0f172a; --muted:#64748b; --line:#e2e8f0; --line-strong:#cbd5e1;
  --accent:#0891b2; --accent-soft:rgba(8,145,178,.10); --accent-glow:rgba(8,145,178,.24);
  --ok:#059669; --ok-soft:rgba(5,150,105,.11);
  --exe:#d97706; --exe-soft:rgba(217,119,6,.12);
  --rev:#2563eb; --rev-soft:rgba(37,99,235,.11);
  --pause:#7c3aed; --pause-soft:rgba(124,58,237,.11);
  --run:#2563eb; --run-soft:rgba(37,99,235,.11);
  --block:#e11d48; --block-soft:rgba(225,29,72,.10);
  --wait:#64748b; --wait-soft:rgba(100,116,139,.10);
  --edge:#94a3b8;
  --shadow:0 1px 2px rgba(15,23,42,.04), 0 6px 20px rgba(15,23,42,.04);
  --shadow-lg:0 16px 40px rgba(15,23,42,.12);
  --f-display:"Plus Jakarta Sans","Inter","Segoe UI",system-ui,sans-serif;
  --f-body:"Inter","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b101b; --canvas-dot:rgba(148,163,184,.10);
  --surface:#121928; --surface-2:#182234; --surface-glass:rgba(18,25,40,.9);
  --fg:#f1f5f9; --muted:#94a3b8; --line:rgba(148,163,184,.14); --line-strong:rgba(148,163,184,.26);
  --accent:#22d3ee; --accent-soft:rgba(34,211,238,.11); --accent-glow:rgba(34,211,238,.26);
  --ok:#34d399; --ok-soft:rgba(52,211,153,.13);
  --exe:#fbbf24; --exe-soft:rgba(251,191,36,.13);
  --rev:#60a5fa; --rev-soft:rgba(96,165,250,.13);
  --pause:#a78bfa; --pause-soft:rgba(167,139,250,.14);
  --run:#60a5fa; --run-soft:rgba(96,165,250,.14);
  --block:#fb7185; --block-soft:rgba(251,113,133,.13);
  --wait:#94a3b8; --wait-soft:rgba(148,163,184,.12);
  --edge:#475569; --shadow:0 2px 10px rgba(0,0,0,.28); --shadow-lg:0 20px 48px rgba(0,0,0,.55);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b101b; --canvas-dot:rgba(148,163,184,.10);
  --surface:#121928; --surface-2:#182234; --surface-glass:rgba(18,25,40,.9);
  --fg:#f1f5f9; --muted:#94a3b8; --line:rgba(148,163,184,.14); --line-strong:rgba(148,163,184,.26);
  --accent:#22d3ee; --accent-soft:rgba(34,211,238,.11); --accent-glow:rgba(34,211,238,.26);
  --ok:#34d399; --ok-soft:rgba(52,211,153,.13);
  --exe:#fbbf24; --exe-soft:rgba(251,191,36,.13);
  --rev:#60a5fa; --rev-soft:rgba(96,165,250,.13);
  --pause:#a78bfa; --pause-soft:rgba(167,139,250,.14);
  --run:#60a5fa; --run-soft:rgba(96,165,250,.14);
  --block:#fb7185; --block-soft:rgba(251,113,133,.13);
  --wait:#94a3b8; --wait-soft:rgba(148,163,184,.12);
  --edge:#475569; --shadow:0 2px 10px rgba(0,0,0,.28); --shadow-lg:0 20px 48px rgba(0,0,0,.55);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);font:14.5px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;line-height:1.25;letter-spacing:-.015em}
p{margin:0} code,pre{font-family:var(--f-mono);font-size:.84em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)} .mono{font-family:var(--f-mono);font-size:.82em}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.clamp1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrap-any{overflow-wrap:anywhere;word-break:break-word;min-width:0}

/* === BARRA SUPERIOR === */
.shell{min-height:100vh;display:flex;flex-direction:column}
.nav{position:sticky;top:0;z-index:40;backdrop-filter:blur(14px);background:var(--surface-glass);border-bottom:1px solid var(--line);padding:10px clamp(16px,3vw,32px);display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.nav-left{display:flex;align-items:center;gap:10px;min-width:0}
.logo-mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#6366f1);display:grid;place-items:center;color:#fff;font:700 13px var(--f-display);flex:none}
.proj-title{font:700 15px var(--f-display);max-width:300px}
.q-toggle{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--muted);cursor:pointer;white-space:nowrap}
.q-toggle:hover{border-color:var(--accent);color:var(--fg)}
.q-drawer{background:var(--surface);border-bottom:1px solid var(--line);padding:12px clamp(16px,3vw,32px);font-size:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.q-drawer b{color:var(--accent)}
.offline-tip{background:var(--accent-soft);border-bottom:1px solid var(--accent-glow);padding:8px clamp(16px,3vw,32px);font-size:12.5px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

.seg-tabs{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg-tab{border:0;background:transparent;border-radius:7px;padding:6px 15px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:all .14s}
.seg-tab:hover{color:var(--fg)}
.seg-tab[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.seg-badge{background:var(--exe-soft);color:var(--exe);font:700 11px var(--f-body);padding:1px 7px;border-radius:999px}

.nav-right{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.pill-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .14s}
.pill-btn:hover{border-color:var(--accent);background:var(--surface-2)}
.dot-live{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.dot-static{width:7px;height:7px;border-radius:50%;background:var(--wait)}
.icon-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;font-size:14px;color:var(--muted)}
.icon-btn:hover{border-color:var(--accent);color:var(--fg)}

/* === BOTÕES E PILLS LIMPOS === */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .12s;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--line-strong);background:var(--surface-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn-ok:hover:not(:disabled){filter:brightness(1.06);background:var(--ok)}
.btn-accent{background:var(--accent);border-color:var(--accent);color:#041318}
.btn-accent:hover:not(:disabled){filter:brightness(1.06);background:var(--accent)}
.btn-soft-ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.btn-soft-ok:hover:not(:disabled){border-color:var(--ok)}
.btn-soft-warn{background:var(--exe-soft);border-color:transparent;color:var(--exe)}
.btn-soft-pause{background:var(--pause-soft);border-color:transparent;color:var(--pause)}
.btn-soft-block{background:var(--block-soft);border-color:transparent;color:var(--block)}
.btn-soft-accent{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.btn-soft-accent:hover:not(:disabled){border-color:var(--accent)}
.btn-sm{padding:5px 11px;font-size:12.5px;border-radius:8px}
.btn-xs{padding:4px 9px;font-size:12px;border-radius:7px}
.btn-ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn-ghost:hover:not(:disabled){color:var(--fg);background:var(--surface-2)}

/* Menu contextual "..." para ações secundárias sem poluição */
.menu-wrap{position:relative;display:inline-flex}
.menu-pop{position:absolute;right:0;top:calc(100% + 5px);z-index:55;background:var(--surface);border:1px solid var(--line-strong);border-radius:11px;padding:5px;min-width:190px;box-shadow:var(--shadow-lg);display:grid;gap:2px}
.menu-item{border:0;background:transparent;border-radius:7px;padding:8px 10px;text-align:left;font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:8px;width:100%}
.menu-item:hover{background:var(--surface-2)}
.menu-item.danger{color:var(--block)}
.menu-sep{height:1px;background:var(--line);margin:3px 6px}

.st-pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.st-pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.st-pill.nob::before{display:none}
.st-verificado{color:var(--ok);background:var(--ok-soft)}
.st-revisado{color:var(--rev);background:var(--rev-soft)}
.st-executado,.st-aguarda{color:var(--exe);background:var(--exe-soft)}
.st-aguardando_decisao{color:var(--pause);background:var(--pause-soft)}
.st-em_curso{color:var(--run);background:var(--run-soft)}
.st-bloqueado,.st-correcao_solicitada{color:var(--block);background:var(--block-soft)}
.st-pendente,.st-parcial{color:var(--wait);background:var(--wait-soft)}
.st-marco{color:var(--exe);background:var(--exe-soft)}
.st-code{color:var(--pause);background:var(--pause-soft)}

/* === LAYOUT PRINCIPAL === */
.main{width:100%;max-width:1180px;margin:0 auto;padding:24px clamp(16px,3vw,32px) 56px;display:grid;gap:20px}
.main.full-bleed{max-width:none;padding-inline:clamp(14px,2.2vw,28px)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:18px 20px;box-shadow:var(--shadow);display:grid;gap:14px;min-width:0}
.alert-strip{background:var(--block-soft);border:1px solid var(--block);border-radius:10px;padding:10px 14px;font-size:13px}
.code-tag{display:inline-block;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;font:500 11.5px var(--f-mono);color:var(--muted)}

/* === ABA AGORA (CALMA, HUMANA E RESPIRÁVEL) === */
.kpi-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.kpi-box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;gap:6px;box-shadow:var(--shadow);min-width:0}
.kpi-lbl{font-size:12px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:6px}
.kpi-val{font:700 16px var(--f-display)}
.bar-slim{height:7px;border-radius:999px;background:var(--surface-2);overflow:hidden;display:flex;margin-top:2px}
.bar-slim i{display:block;height:100%}

.focus-card{background:linear-gradient(135deg,var(--accent-soft),var(--surface) 60%);border:1px solid var(--accent-glow);border-radius:16px;padding:22px 24px;box-shadow:var(--shadow);display:grid;gap:12px}
.focus-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.focus-eyebrow{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.02em}
.focus-title{font:700 clamp(18px,2.2vw,22px) var(--f-display)}
.action-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-top:4px}

.queue-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:visible}
.queue-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.qrows{display:grid}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);transition:background .12s}
.qrow:last-child{border-bottom:0}
.qrow:hover{background:var(--surface-2)}
.qrow-main{min-width:0;display:grid;gap:5px}
.qrow-title{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.qrow-sub{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.qrow-actions{display:flex;gap:6px;align-items:center;flex:none}

.bottom-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.compact-list{display:grid;gap:8px}
.compact-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-size:13px}
.compact-row.is-block{border-left:3px solid var(--block)}

/* === ABA PROJETO — CANVAS ARCHIFY LIMPO === */
.canvas-shell{display:grid;gap:12px}
.canvas-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.canvas-bar-group{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.search-in{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 11px;font-size:13px;width:210px}
.search-in:focus{border-color:var(--accent);outline:none;background:var(--surface)}

.workspace-split{position:relative;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.workspace-split.with-inspector{grid-template-columns:minmax(0,1fr) 370px}

.arch-viewport{position:relative;background-color:var(--bg);background-image:radial-gradient(var(--canvas-dot) 1.25px, transparent 1.25px);background-size:20px 20px;border:1px solid var(--line);border-radius:16px;overflow:auto;min-height:540px;max-height:76vh;padding:18px}
.arch-world{position:relative;display:inline-flex;gap:22px;align-items:flex-start;transform-origin:0 0;min-width:max-content;padding:4px 8px 38px 4px}
svg.arch-svg{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:visible}
svg.arch-svg path{fill:none;transition:opacity .18s,stroke .18s,stroke-width .18s}
svg.arch-svg path.e-seq{stroke:var(--edge);stroke-width:1.75}
svg.arch-svg path.e-block{stroke:var(--block);stroke-width:2.25;stroke-dasharray:6 4}
svg.arch-svg path.e-hot-up{stroke:var(--accent);stroke-width:2.8;stroke-dasharray:none}
svg.arch-svg path.e-hot-down{stroke:var(--exe);stroke-width:2.8;stroke-dasharray:none}
svg.arch-svg path.e-hot-block{stroke:var(--block);stroke-width:3;stroke-dasharray:none}
svg.arch-svg path.e-dim{opacity:.14}

.lane{position:relative;z-index:2;width:236px;flex:0 0 auto;display:grid;gap:14px}
.lane-head{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;cursor:pointer;display:grid;gap:4px;box-shadow:var(--shadow);transition:all .15s;text-align:left}
.lane-head:hover{border-color:var(--accent)}
.lane-head.is-current{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent), 0 6px 20px var(--accent-soft)}
.lane-head-top{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);font-weight:600}
.lane-title{font:700 14px var(--f-display)}

.mod-node{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:13px;box-shadow:var(--shadow);display:grid;gap:8px;transition:all .14s}
.mod-node::before{content:"";position:absolute;left:0;top:11px;bottom:11px;width:3.5px;border-radius:0 4px 4px 0;background:var(--node-accent,var(--wait))}
.mod-node:hover{border-color:var(--line-strong);transform:translateY(-1px)}
.mod-node.is-final{box-shadow:0 0 0 1.5px var(--accent), var(--shadow)}
.mod-node.is-dim{opacity:.24}
.mod-node.is-hot{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft), var(--shadow)}
.mod-node.st-n-verificado{--node-accent:var(--ok)}
.mod-node.st-n-aguarda{--node-accent:var(--exe)}
.mod-node.st-n-em_curso{--node-accent:var(--run)}
.mod-node.st-n-bloqueado{--node-accent:var(--block)}
.mod-node.st-n-pendente,.mod-node.st-n-parcial{--node-accent:var(--wait)}

.mod-head-btn{background:none;border:0;padding:0;text-align:left;cursor:pointer;display:grid;gap:5px;width:100%}
.mod-meta{display:flex;justify-content:space-between;align-items:center;gap:6px}
.mod-title{font:700 13.5px var(--f-display);line-height:1.3}

.stages-wrap{display:grid;gap:8px;padding-top:8px;border-top:1px dashed var(--line)}
.st-card{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;display:grid;gap:6px;cursor:pointer;transition:all .12s}
.st-card:hover{border-color:var(--accent)}
.st-card.is-sel{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 2px var(--accent-soft)}
.st-card-top{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:nowrap}
.st-card-top .st-pill{font-size:10.5px;padding:2px 7px;white-space:nowrap}
.st-card-title{font-size:12.5px;font-weight:600;line-height:1.32}

.mini-ced{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;padding-top:6px;border-top:1px solid var(--line)}
.mini-ced-box{background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:5px 7px;font-size:10.5px;display:grid;gap:2px}
.mini-ced-box b{color:var(--accent);font-size:10px}

/* Inspetor flutuante direito no Projeto */
.inspector{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow-lg);display:grid;gap:14px;max-height:76vh;overflow-y:auto;position:sticky;top:72px;min-width:0}
.ins-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;border-bottom:1px solid var(--line);padding-bottom:10px}
.ins-sec{display:grid;gap:6px;font-size:13px;min-width:0}
.ins-sec h4{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.ins-box{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;display:grid;gap:7px;min-width:0;overflow-wrap:anywhere;word-break:break-word}

/* === REVISÃO CONTEXTUAL === */
.rev-grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
.rev-rail{position:sticky;top:72px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow-lg);display:grid;gap:13px;min-width:0}
.ev-stage{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:14px;display:grid;gap:10px;overflow-x:auto}
.ev-img{max-width:100%;max-height:520px;object-fit:contain;border-radius:8px;background:#fff;border:1px solid var(--line);cursor:zoom-in}
.ev-table-wrap{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.ev-table{border-collapse:collapse;width:100%;font-size:12.5px;font-family:var(--f-mono)}
.ev-table th,.ev-table td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.ev-table th{position:sticky;top:0;background:var(--surface-2);font-weight:700}
.ev-md{font-size:14px;line-height:1.6;display:grid;gap:8px}
.ev-md pre{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;margin:0}
.ev-md ul{margin:0;padding-left:18px}

/* === ABA AGENTE (1 PAINEL POR VEZ, ZERO OVERFLOW, PORTUGUÊS CLARO) === */
.agent-shell{display:grid;grid-template-columns:280px minmax(0,1fr);gap:18px;align-items:start}
.agent-rail{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:14px;box-shadow:var(--shadow);display:grid;gap:10px;max-height:78vh;overflow-y:auto;position:sticky;top:72px;min-width:0}
.rail-phase{display:grid;gap:4px}
.rail-phase-lbl{font-size:11px;font-weight:700;color:var(--muted);padding:6px 6px 2px;letter-spacing:.02em}
.rail-item{border:1px solid transparent;background:transparent;border-radius:9px;padding:8px 10px;text-align:left;cursor:pointer;display:grid;gap:3px;transition:all .12s;width:100%;min-width:0}
.rail-item:hover{background:var(--surface-2);border-color:var(--line)}
.rail-item.is-active{background:var(--accent-soft);border-color:var(--accent)}
.rail-item-title{font-size:13px;font-weight:600;line-height:1.3}
.agent-main{display:grid;gap:16px;min-width:0}
.agent-canvas{position:relative;background-color:var(--bg);background-image:radial-gradient(var(--canvas-dot) 1.25px, transparent 1.25px);background-size:20px 20px;border:1px solid var(--line);border-radius:16px;padding:18px;overflow:hidden}
.layer-grid{position:relative;display:grid;grid-template-columns:repeat(4,minmax(160px,1fr));gap:24px;z-index:2}
.layer-node{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:13px 14px;cursor:pointer;text-align:left;display:grid;gap:5px;box-shadow:var(--shadow);transition:all .14s;position:relative;min-width:0}
.layer-node::before{content:"";position:absolute;top:0;left:12px;right:12px;height:3px;border-radius:0 0 3px 3px;background:var(--layer-c,var(--accent))}
.layer-node:hover{border-color:var(--accent);transform:translateY(-1px)}
.layer-node.open{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft), var(--shadow)}
.clean-list{margin:0;padding-left:18px;display:grid;gap:6px}
.chip-row{display:flex;flex-wrap:wrap;gap:6px}
.file-chip{display:inline-flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:12px;max-width:100%}
.comp-table{width:100%;border-collapse:collapse;font-size:13px}
.comp-table th,.comp-table td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.comp-table th{background:var(--surface-2);font-size:11.5px;font-weight:700;color:var(--muted)}
.lineage{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lin-node{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12.5px}

/* === MODAIS, TOAST E FORMULÁRIOS === */
.input,.textarea{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13.5px}
.input:focus,.textarea:focus{border-color:var(--accent);outline:none;background:var(--surface)}
.textarea{min-height:76px;resize:vertical}
.modal-bg{position:fixed;inset:0;background:rgba(2,6,23,.58);backdrop-filter:blur(4px);z-index:70;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;display:grid;gap:14px;box-shadow:var(--shadow-lg)}
.toast{position:fixed;right:20px;bottom:20px;z-index:90;background:var(--surface);border:1px solid var(--accent);border-radius:12px;padding:11px 16px;box-shadow:var(--shadow-lg);font-size:13.5px;font-weight:600;max-width:420px}
.toast.err{border-color:var(--block);color:var(--block)}
.lightbox{position:fixed;inset:0;background:rgba(2,6,23,.88);z-index:95;display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
.lightbox img{max-width:95vw;max-height:92vh;background:#fff;border-radius:10px}

/* === RESPONSIVO === */
@media (max-width:1024px){
  .workspace-split.with-inspector,.rev-grid,.agent-shell{grid-template-columns:minmax(0,1fr)}
  .inspector,.rev-rail,.agent-rail{position:static;max-height:none}
  .layer-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:760px){
  .kpi-strip,.bottom-two,.layer-grid{grid-template-columns:minmax(0,1fr)}
  .qrow{grid-template-columns:minmax(0,1fr);gap:8px}
  .arch-world{flex-direction:column;gap:20px;min-width:0;width:100%;padding:4px}
  .lane{width:100%}
  .proj-title{max-width:180px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div class="shell" id="app"></div>
<script>
let D = /*__DADOS__*/null;
(function(){
  if (!D || !D.estado) {
    document.getElementById('app').innerHTML = '<div class="main"><div class="alert-strip">Nenhum dado carregado. Abra com <code>python specboard.py serve --open</code>.</div></div>';
    return;
  }

  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const baseName = p => String(p || '').split(/[\\/]/).pop() || String(p || '');
  const POL_LABEL = {acompanhamento_livre:'Livre (sem travas)', so_marcos:'Só nos marcos', por_etapa:'Etapa por etapa'};
  const ST_LABEL = {
    verificado:'Aprovado', revisado:'Lido', executado:'Aguarda sua decisão',
    aguardando_decisao:'Em espera', em_curso:'Em andamento',
    bloqueado:'Pausado', correcao_solicitada:'Ajuste solicitado',
    pendente:'Próximo', aguarda:'Aguarda decisão', parcial:'Em andamento'
  };
  const ATIV_LABEL = {
    executando:'Trabalhando agora', aguardando_humano:'Aguardando você',
    aguardando_correcao:'Aguardando retomada', ocioso:'Parado', sem_dados:'Sem atividade informada'
  };
  const TIPO_COMP = {skill:'Guia (Skill)', local_tool:'Script local', mcp_tool:'Integração (MCP)'};

  const UI = {
    tab: 'agora',
    showQuestion: false,
    queueFilter: 'pendentes',
    showAllBlockers: false,
    openMenuId: null, // controla qual menu "⋯" está aberto
    projetoModo: 'fluxo',
    projetoFiltro: 'todos',
    projetoSearch: '',
    zoom: 1,
    expandedPhases: new Set(),
    expandedModules: new Set(),
    selectedStageId: null,
    selectedModId: null,
    hoverModId: null,
    returnAfterReview: null,
    reviewStageId: null,
    reviewEvIndex: 0,
    reviewEvidenceCache: {},
    reviewConflictMsg: '',
    reviewBusy: false,
    agentStageId: null,
    agentReturnStageId: null,
    agentSearch: '',
    agentActiveLayer: 'contexto', // 1 painel focado por vez (zero sobrecarga!)
    agentContextBundle: null,
    showPolicyModal: false,
    policyBusy: false,
    policyError: '',
    actionModal: null,
    actionBusy: false,
    actionError: '',
    reviewerModal: false,
    toast: null,
    lightboxSrc: ''
  };

  let toastTimer = null;
  function showToast(text, isErr){
    UI.toast = {text, err: !!isErr};
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { UI.toast = null; renderToastOnly(); }, 4200);
    renderToastOnly();
  }
  function renderToastOnly(){
    const old = document.getElementById('sb-toast');
    if (old) old.remove();
    if (!UI.toast) return;
    const div = document.createElement('div');
    div.id = 'sb-toast';
    div.className = 'toast' + (UI.toast.err ? ' err' : '');
    div.textContent = UI.toast.text;
    document.body.appendChild(div);
  }

  function projectKey(k){ return 'specboard.v2.' + ((D.estado.projeto && D.estado.projeto.nome) || 'p') + '.' + k; }
  function getReviewer(){ try { return localStorage.getItem(projectKey('revisor')) || ''; } catch(e) { return ''; } }
  function setReviewer(v){ try { localStorage.setItem(projectKey('revisor'), (v || '').trim()); } catch(e) {} }
  function canWrite(){ return !!(D.modo_servidor && !(D.servidor && D.servidor.readonly)); }

  function findStage(sid){
    for (const m of (D.estado.modulos || [])) {
      for (const e of (m.etapas || [])) if (e.id === sid) return {m, e};
    }
    return null;
  }
  function findMod(mid){ return (D.estado.modulos || []).find(m => m.id === mid) || null; }
  function allStages(){
    const out = [];
    for (const m of (D.estado.modulos || [])) for (const e of (m.etapas || [])) out.push({m, e});
    return out;
  }
  function fasesList(){
    const mods = D.estado.modulos || [];
    return (D.estado.fases && D.estado.fases.length) ? D.estado.fases : [...new Set(mods.map(m => m.fase || '—'))];
  }
  function formatUnlocks(list){
    if (!list || !list.length) return '';
    const mods = list.filter(x => x.tipo === 'modulo').map(x => x.titulo || x.id);
    const arr = mods.length ? mods : list.map(x => x.titulo || x.id);
    return arr.slice(0, 2).join(', ') + (arr.length > 2 ? ` (+${arr.length - 2})` : '');
  }

  (function init(){
    const sit = D.situacao_atual || {};
    fasesList().forEach(f => UI.expandedPhases.add(f));
    if (sit.modulo_atual_id) UI.expandedModules.add(sit.modulo_atual_id);
    const stages = allStages();
    const emCurso = stages.find(s => s.e._status === 'em_curso' && s.e._agente && s.e._agente.possui_definicao);
    const primeiraComArq = stages.find(s => s.e._agente && s.e._agente.possui_definicao);
    UI.agentStageId = (emCurso && emCurso.e.id) || (primeiraComArq && primeiraComArq.e.id) || sit.etapa_foco_id || (stages[0] && stages[0].e.id) || null;
  })();

  function getEffectiveMudancas(){
    if (D.modo_servidor && D.mudancas) return D.mudancas;
    try {
      const raw = localStorage.getItem(projectKey('visita'));
      if (!raw) return {referencia_confiavel:false, referencia_em:'', novos:[]};
      const v = JSON.parse(raw);
      if (!v || !Array.isArray(v.event_ids)) return {referencia_confiavel:false, referencia_em:'', novos:[]};
      const seen = new Set(v.event_ids);
      return {referencia_confiavel:true, referencia_em:v.registrada_em || '', novos:(D.eventos || []).filter(e => !seen.has(e.id))};
    } catch(e) { return {referencia_confiavel:false, referencia_em:'', novos:[]}; }
  }

  async function apiPost(url, body){
    const token = (D.servidor && D.servidor.token) || '';
    const res = await fetch(url, {
      method: 'POST',
      headers: {'Content-Type':'application/json', 'X-Specboard-Token': token},
      body: JSON.stringify(body)
    });
    const data = await res.json().catch(() => ({}));
    return {status: res.status, data};
  }

  const ACAO_META = {
    verificado:       {lbl:'Aprovar entrega',     okMsg:'aprovada e salva',            exigeNota:false},
    revisado:         {lbl:'Marcar como lido',    okMsg:'marcada como lida',           exigeNota:false},
    aguardar_decisao: {lbl:'Deixar em espera',    okMsg:'colocada em espera',          exigeNota:false},
    pedir_correcao:   {lbl:'Pedir ajuste',        okMsg:'devolvida para ajuste',       exigeNota:true},
    bloquear:         {lbl:'Pausar / bloquear',   okMsg:'pausada manualmente',         exigeNota:true},
    desbloquear:      {lbl:'Retomar etapa',       okMsg:'retomada para o fluxo',       exigeNota:false}
  };

  async function triggerAction(etapaId, acao, notaDireta){
    UI.openMenuId = null;
    if (!canWrite()) {
      showToast('Você abriu a cópia offline. Para salvar decisões, use o painel aberto pelo servidor local.', true);
      return;
    }
    const meta = ACAO_META[acao];
    if (!meta) return;
    const rev = getReviewer();
    const pair = findStage(etapaId);
    if (!pair) return;

    if ((meta.exigeNota && notaDireta === undefined) || !rev) {
      UI.actionModal = {etapaId, acao, titulo: pair.e.titulo, exigeNota: meta.exigeNota, precisaRevisor: !rev, notaInicial: notaDireta || ''};
      UI.actionError = '';
      render();
      setTimeout(() => {
        const inp = document.getElementById(!rev ? 'act-revisor' : 'act-nota');
        if (inp) inp.focus();
      }, 20);
      return;
    }
    await executeAction(etapaId, acao, rev, notaDireta || '');
  }

  async function executeAction(etapaId, acao, revisor, nota){
    const pair = findStage(etapaId);
    if (!pair) return;
    const fp = pair.e._snapshot && pair.e._snapshot.fingerprint_total;
    UI.actionBusy = true; UI.reviewBusy = true; UI.actionError = ''; UI.reviewConflictMsg = '';
    render();
    const {status, data} = await apiPost('/api/decisao', {
      etapa_id: etapaId, acao, revisor, nota, observed_fingerprint: fp
    });
    UI.actionBusy = false; UI.reviewBusy = false;
    if (status === 200 && data.payload) {
      D = data.payload;
      UI.actionModal = null;
      render();
      showToast(`✓ ${pair.e.titulo.slice(0, 42)} — ${ACAO_META[acao].okMsg}.`);
    } else if (status === 409 && data.payload) {
      D = data.payload;
      UI.actionModal = null;
      UI.reviewEvidenceCache = {};
      UI.reviewConflictMsg = data.erro || 'Um arquivo desta entrega mudou enquanto você revisava.';
      if (!UI.reviewStageId) openReview(etapaId, null); else render();
      showToast('Os arquivos mudaram no disco — confira novamente antes de aprovar.', true);
    } else {
      const msg = data.erro || 'Não foi possível salvar a decisão.';
      UI.actionError = msg;
      render();
      showToast(msg, true);
    }
  }

  async function lockContractNow(modId){
    if (!canWrite()) { showToast('Abra pelo servidor local para travar critérios.', true); return; }
    const {status, data} = await apiPost('/api/contrato/lock', {modulo_id: modId});
    if (status === 200 && data.payload) { D = data.payload; render(); showToast(`🔒 Critérios de ${modId} travados.`); }
    else showToast(data.erro || 'Erro ao travar critérios.', true);
  }

  // Botões limpos e legíveis: Revisar + Aprovar + menu "⋯" com ações secundárias
  function renderRowActions(e, menuKey, qidx){
    const s = e._status;
    const w = canWrite();
    const canApprove = w && s !== 'verificado' && ['executado','revisado','aguardando_decisao','correcao_solicitada'].includes(s);
    const isPaused = ['bloqueado','aguardando_decisao','correcao_solicitada'].includes(s);
    const isOpen = UI.openMenuId === menuKey;

    const menuItems = [];
    if (w && (s === 'executado' || s === 'revisado')) {
      menuItems.push(`<button type="button" class="menu-item" data-act="aguardar_decisao" data-sid="${esc(e.id)}">⏸ Deixar em espera</button>`);
      menuItems.push(`<button type="button" class="menu-item" data-act="pedir_correcao" data-sid="${esc(e.id)}">↺ Pedir ajuste</button>`);
      menuItems.push(`<button type="button" class="menu-item" data-act="revisado" data-sid="${esc(e.id)}">📖 Marcar só como lido</button>`);
    }
    if (w && isPaused) {
      menuItems.push(`<button type="button" class="menu-item" data-act="desbloquear" data-sid="${esc(e.id)}">▶ Retomar etapa</button>`);
    }
    if (w && s !== 'bloqueado') {
      menuItems.push(`<button type="button" class="menu-item danger" data-act="bloquear" data-sid="${esc(e.id)}">⛔ Pausar / bloquear</button>`);
    }
    if (menuItems.length) menuItems.push('<div class="menu-sep"></div>');
    menuItems.push(`<button type="button" class="menu-item" data-goto-agent="${esc(e.id)}">⚙ Ver detalhes do agente</button>`);

    return `<button type="button" class="btn btn-sm" data-open-review="${esc(e.id)}"${qidx !== undefined ? ` data-qidx-btn="${qidx}"` : ''}>Revisar</button>
      ${canApprove ? `<button type="button" class="btn btn-soft-ok btn-sm" data-act="verificado" data-sid="${esc(e.id)}">✓ Aprovar</button>` : ''}
      ${w && isPaused ? `<button type="button" class="btn btn-soft-accent btn-sm" data-act="desbloquear" data-sid="${esc(e.id)}">▶ Retomar</button>` : ''}
      <div class="menu-wrap">
        <button type="button" class="btn btn-ghost btn-sm" data-toggle-menu="${esc(menuKey)}" aria-expanded="${isOpen ? 'true' : 'false'}" title="Mais ações">⋯</button>
        ${isOpen ? `<div class="menu-pop">${menuItems.join('')}</div>` : ''}
      </div>`;
  }

  async function loadEvidencePreview(ref, midia){
    if (!D.modo_servidor || !ref || midia === 'imagem') return;
    if (UI.reviewEvidenceCache[ref]) return;
    UI.reviewEvidenceCache[ref] = {loading: true};
    render();
    try {
      const res = await fetch('/api/evidencia?ref=' + encodeURIComponent(ref));
      const data = await res.json();
      UI.reviewEvidenceCache[ref] = res.ok ? data : {erro: data.erro || 'Erro ao carregar'};
    } catch(err) { UI.reviewEvidenceCache[ref] = {erro: String(err)}; }
    render();
  }

  function openReview(etapaId, qIdx){
    UI.openMenuId = null;
    const pair = findStage(etapaId);
    if (!pair) return;
    UI.returnAfterReview = {tab: UI.tab, scrollY: window.scrollY, qIdx: typeof qIdx === 'number' ? qIdx : null, stageId: UI.selectedStageId};
    UI.reviewStageId = etapaId;
    UI.reviewEvIndex = 0;
    UI.reviewEvidenceCache = {};
    render();
    window.scrollTo({top: 0, behavior: 'instant'});
    const evs = (pair.e._snapshot && pair.e._snapshot.evidencias) || [];
    if (evs[0] && evs[0].estado === 'ok') loadEvidencePreview(evs[0].ref, evs[0].midia);
  }
  function closeReview(){
    const ret = UI.returnAfterReview;
    UI.reviewStageId = null; UI.reviewConflictMsg = '';
    if (ret) { UI.tab = ret.tab; UI.selectedStageId = ret.stageId; }
    render();
    if (ret) setTimeout(() => window.scrollTo({top: ret.scrollY || 0, behavior: 'instant'}), 15);
  }
  function jumpToAgent(etapaId){
    UI.openMenuId = null;
    UI.agentReturnStageId = etapaId;
    UI.agentStageId = etapaId;
    UI.agentContextBundle = null;
    UI.reviewStageId = null;
    UI.tab = 'agente';
    render();
    window.scrollTo({top: 0, behavior: 'instant'});
  }
  function returnFromAgent(){
    const sid = UI.agentReturnStageId || UI.agentStageId;
    const pair = sid ? findStage(sid) : null;
    UI.tab = 'projeto';
    if (pair) {
      UI.expandedPhases.add(pair.m.fase || '—');
      UI.expandedModules.add(pair.m.id);
      UI.selectedModId = pair.m.id;
      UI.selectedStageId = pair.e.id;
    }
    render();
  }

  function renderMarkdownSafe(md){
    const lines = String(md || '').split(/\r?\n/);
    let html = '', inCode = false, inList = false;
    const inl = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    for (const raw of lines) {
      if (raw.trim().startsWith('```')) {
        if (inList) { html += '</ul>'; inList = false; }
        html += inCode ? '</code></pre>' : '<pre><code>';
        inCode = !inCode; continue;
      }
      if (inCode) { html += esc(raw) + '\n'; continue; }
      const t = raw.trim();
      if (!t) { if (inList) { html += '</ul>'; inList = false; } continue; }
      const hm = t.match(/^(#{1,4})\s+(.*)$/);
      if (hm) { if (inList) { html += '</ul>'; inList = false; } html += `<h${Math.min(4, hm[1].length + 1)}>${inl(hm[2])}</h${Math.min(4, hm[1].length + 1)}>`; }
      else if (/^[-*]\s+/.test(t)) { if (!inList) { html += '<ul>'; inList = true; } html += `<li>${inl(t.replace(/^[-*]\s+/, ''))}</li>`; }
      else { if (inList) { html += '</ul>'; inList = false; } html += `<p>${inl(t)}</p>`; }
    }
    if (inList) html += '</ul>';
    if (inCode) html += '</code></pre>';
    return html || '<p class="muted">(vazio)</p>';
  }

  // ==================== BARRA SUPERIOR ====================
  function renderNav(){
    const P = D.estado.projeto || {};
    const pol = D.politica || {};
    const filaN = (D.fila || []).length;
    const rev = getReviewer();
    return `<header class="nav">
      <div class="nav-left">
        <div class="logo-mark" aria-hidden="true">SB</div>
        <div class="proj-title clamp1" title="${esc(P.titulo || P.nome)}">${esc(P.nome || P.titulo || 'SpecBoard')}</div>
        <button type="button" class="q-toggle" id="btn-toggle-q">${UI.showQuestion ? 'Ocultar objetivo ▴' : 'Objetivo central ▾'}</button>
      </div>
      <div class="seg-tabs" role="tablist" aria-label="Navegação principal">
        <button type="button" role="tab" class="seg-tab" data-tab="agora" aria-selected="${UI.tab === 'agora' && !UI.reviewStageId ? 'true' : 'false'}">
          Agora ${filaN ? `<span class="seg-badge">${filaN}</span>` : ''}
        </button>
        <button type="button" role="tab" class="seg-tab" data-tab="projeto" aria-selected="${UI.tab === 'projeto' && !UI.reviewStageId ? 'true' : 'false'}">
          Projeto
        </button>
        <button type="button" role="tab" class="seg-tab" data-tab="agente" aria-selected="${UI.tab === 'agente' && !UI.reviewStageId ? 'true' : 'false'}">
          Agente
        </button>
      </div>
      <div class="nav-right">
        <button type="button" class="pill-btn" id="btn-reviewer" title="Seu nome para aprovar em 1 clique">
          👤 ${rev ? esc(rev) : '<span class="muted">Seu nome</span>'}
        </button>

  // ==================== ABA 1: AGORA ====================
  function renderAgora(){
    const sit = D.situacao_atual || {};

    const ativ = sit.atividade_agente || {};
    const bloqs = sit.bloqueios_sistema || [];
    const prox = sit.proxima_acao || {};
    const R = D.resumo || {};
    const c = R.contagem || {};
    const tot = R.total || 0;
    const pct = tot ? Math.round(100 * (R.verificadas || 0) / tot) : 0;
    const w = n => tot ? (100 * (n || 0) / tot) : 0;
    const mud = getEffectiveMudancas();

    const focusPair = prox.etapa_id ? findStage(prox.etapa_id) : null;

    else if (UI.queueFilter === 'bloqueadas') listItems = stagesAll.filter(p => p.e._status === 'bloqueado' || p.e._status === 'correcao_solicitada').map(pair => ({item: {id:pair.e.id, titulo:pair.e.titulo, fase:pair.m.fase, eh_marco:pair.e._eh_marco, bloqueia_agora:pair.e._bloqueia_agora}, pair}));

    const bloqVisiveis = UI.showAllBlockers ? bloqs : bloqs.slice(0, 4);
    const nPause = stagesAll.filter(p => p.e._status === 'aguardando_decisao').length;
    const nBlk = stagesAll.filter(p => p.e._status === 'bloqueado' || p.e._status === 'correcao_solicitada').length;

    return `<div class="main">

        <div class="kpi-box">
          <div class="kpi-lbl"><span>Onde o projeto está</span><button type="button" class="btn btn-ghost btn-xs" data-goto-mod="${esc(sit.modulo_atual_id || '')}">Ver no mapa →</button></div>
          <div class="kpi-val clamp1">${esc(sit.fase_atual || '—')}</div>
          <div class="muted clamp1" style="font-size:12.5px">Ponto atual: ${esc(marco.titulo || '—')}</div>
        </div>

          <div class="kpi-lbl"><span>Aprovado por você</span><b style="color:var(--ok);font-size:14px">${pct}%</b></div>
          <div class="bar-slim" aria-hidden="true">
            <i style="width:${w(c.verificado)}%;background:var(--ok)"></i>
            <i style="width:${w(c.revisado)}%;background:var(--rev)"></i>
            <i style="width:${w(c.executado)}%;background:var(--exe)"></i>
            <i style="width:${w(c.aguardando_decisao)}%;background:var(--pause)"></i>
            <i style="width:${w(c.em_curso)}%;background:var(--run)"></i>
            <i style="width:${w((c.bloqueado || 0) + (c.correcao_solicitada || 0))}%;background:var(--block)"></i>
          </div>
          <div class="muted" style="font-size:12.5px"><b>${c.verificado || 0} de ${tot}</b> aprovadas · ${(c.executado || 0) + (c.revisado || 0)} feitas pelo agente</div>
        </div>
      </section>

      <section class="focus-card" aria-label="Sua próxima ação">
        <div class="focus-top">
          <span class="focus-eyebrow">SUA VEZ AGORA</span>
          ${focusPair ? `<span class="st-pill st-${esc(focusPair.e._status)}">${esc(ST_LABEL[focusPair.e._status] || focusPair.e._status)}</span>` : ''}
        </div>
        <div class="focus-title">${esc(prox.titulo || 'Tudo em dia')}</div>
        <p class="muted" style="font-size:14px">${esc(prox.detalhe || '')}</p>
        <div class="action-bar">
          ${focusPair ? `
            <button type="button" class="btn btn-accent" data-open-review="${esc(focusPair.e.id)}" data-qidx-btn="0">Revisar evidências</button>
            ${canWrite() && focusPair.e._status !== 'verificado' ? `<button type="button" class="btn btn-ok" data-act="verificado" data-sid="${esc(focusPair.e.id)}">✓ Aprovar direto</button>` : ''}
            ${canWrite() ? `
              <button type="button" class="btn" data-act="aguardar_decisao" data-sid="${esc(focusPair.e.id)}">Deixar em espera</button>
              <button type="button" class="btn" data-act="pedir_correcao" data-sid="${esc(focusPair.e.id)}">Pedir ajuste</button>
              <button type="button" class="btn btn-ghost" data-act="bloquear" data-sid="${esc(focusPair.e.id)}">Pausar etapa</button>

          ` : `<button type="button" class="btn btn-accent" data-tab-jump="projeto">Abrir mapa do Projeto →</button>`}

      <section class="queue-card" aria-label="Entregas aguardando decisão">

              ${filaTodas.length !== filaBloq.length ? `<button type="button" class="seg-tab" data-qfilter="todas" aria-selected="${UI.queueFilter === 'todas' ? 'true' : 'false'}">Todas (${filaTodas.length})</button>` : ''}

              <button type="button" class="seg-tab" data-qfilter="bloqueadas" aria-selected="${UI.queueFilter === 'bloqueadas' ? 'true' : 'false'}">Pausadas (${nBlk})</button>

        </div>
        <div class="qrows">
          ${listItems.length ? listItems.map(({item, pair}, idx) => {
            if (!pair) return '';

            return `<div class="qrow" data-qidx="${idx}">
              <div class="qrow-main">
                <div class="qrow-title">
                  <span>${esc(item.titulo)}</span>
                  <span class="code-tag">${esc(item.id)}</span>
                </div>
                <div class="qrow-sub">
                  <span class="st-pill st-${esc(pair.e._status)}">${esc(ST_LABEL[pair.e._status] || pair.e._status)}</span>
                  ${item.eh_marco ? '<span class="st-pill st-marco nob">Marco principal</span>' : ''}
                  ${pair.e._exp ? `<span class="st-pill st-bloqueado">Arquivo alterado</span>` : ''}
                  ${unlockStr ? `<span>Libera: <b>${esc(unlockStr)}</b></span>` : `<span>${esc(item.fase || '')}</span>`}
                </div>
              </div>
              <div class="qrow-actions">${renderRowActions(pair.e, 'q-' + item.id, idx)}</div>

          }).join('') : `<div style="padding:24px;text-align:center" class="muted">Nada pendente nesta aba.</div>`}
        </div>
      </section>

      <section class="bottom-two">
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
            <h3>Pontos travados ou aguardando autorização <span class="muted" style="font-weight:500">(${bloqs.length})</span></h3>
            ${bloqs.length > 4 ? `<button type="button" class="btn btn-ghost btn-xs" id="btn-all-bloqs">${UI.showAllBlockers ? 'Mostrar menos' : 'Ver todos'}</button>` : ''}
          </div>
          ${bloqVisiveis.length ? `<div class="compact-list">${bloqVisiveis.map(b => {
            const pOrig = b.origem_id ? findStage(b.origem_id) : null;
            return `<div class="compact-row is-block">
              <div class="wrap-any">
                <div style="font-weight:600">${esc(b.titulo)}</div>
                <div class="muted" style="font-size:12px">${esc(b.detalhe)}</div>
              </div>
              <div style="display:flex;gap:5px;flex:none">
                ${pOrig ? `<button type="button" class="btn btn-xs" data-open-review="${esc(pOrig.e.id)}">Abrir</button>` : ''}
              </div>
            </div>`;
          }).join('')}</div>` : '<p class="muted">Nenhum ponto travado fora da fila acima.</p>'}
        </div>

        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
            <h3>Novidades desde sua última visita</h3>
            <button type="button" class="btn btn-xs" id="btn-mark-visit">${mud.referencia_confiavel ? 'Marcar como visto' : 'Marcar ponto inicial'}</button>
          </div>
          ${mud.referencia_confiavel ? (
            mud.novos.length
              ? `<div class="compact-list">${mud.novos.slice(0, 5).map(ev => `<div class="compact-row"><span class="wrap-any">${esc(ev.texto)}</span><span class="muted" style="font-size:11.5px;flex:none">${esc(ev.data)}</span></div>`).join('')}</div>`
              : `<p class="muted">Nenhuma novidade desde ${esc(mud.referencia_em)}.</p>`
          ) : '<p class="muted">Clique em <b>Marcar ponto inicial</b> para acompanhar o que mudar a partir de hoje.</p>'}
        </div>
      </section>
    </div>`;
  }

  // ==================== ABA 2: PROJETO (CANVAS ARCHIFY LIMPO) ====================
  function getConnectedModSet(mid){
    const up = new Set(), down = new Set();
    if (!mid) return {up, down};
    for (const r of (D.relacoes_mapa || [])) {
      if (r.para === mid) up.add(r.de);
      if (r.de === mid) down.add(r.para);
    }
    return {up, down};
  }

  function renderInspector(){
    const pair = UI.selectedStageId ? findStage(UI.selectedStageId) : null;
    const mod = pair ? pair.m : (UI.selectedModId ? findMod(UI.selectedModId) : null);
    if (!mod) return '';
    const ct = mod.contrato || {};
    const canLock = !ct.hash && ct.pergunta && (ct.criterios_aceitacao || []).length && ct.criterio_abandono;

    if (pair) {
      const {m, e} = pair;
      const evs = (e._snapshot && e._snapshot.evidencias) || [];
      const unlockStr = formatUnlocks(e._libera) || 'fim do ciclo';
      const w = canWrite();
      return `<aside class="inspector" aria-label="Detalhes da etapa">
        <div class="ins-head">
          <div class="wrap-any">
            <span class="code-tag">${esc(e.id)}</span>
            <h3 style="margin-top:6px">${esc(e.titulo)}</h3>
          </div>
          <button type="button" class="icon-btn" id="btn-close-ins" title="Fechar">×</button>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <span class="st-pill st-${esc(e._status)}">${esc(ST_LABEL[e._status] || e._status)}</span>
          ${e._eh_marco ? '<span class="st-pill st-marco nob">Marco principal</span>' : ''}
        </div>
        <div class="action-bar">
          <button type="button" class="btn btn-accent btn-sm" data-open-review="${esc(e.id)}">Revisar evidências</button>
          ${w && e._status !== 'verificado' && ['executado','revisado','aguardando_decisao','correcao_solicitada'].includes(e._status)
            ? `<button type="button" class="btn btn-ok btn-sm" data-act="verificado" data-sid="${esc(e.id)}">✓ Aprovar</button>` : ''}
          ${w ? `
            <button type="button" class="btn btn-sm" data-act="aguardar_decisao" data-sid="${esc(e.id)}">Em espera</button>
            <button type="button" class="btn btn-sm" data-act="pedir_correcao" data-sid="${esc(e.id)}">Pedir ajuste</button>
            <button type="button" class="btn btn-sm btn-soft-block" data-act="bloquear" data-sid="${esc(e.id)}">Pausar</button>
          ` : ''}
          ${w && ['bloqueado','aguardando_decisao','correcao_solicitada'].includes(e._status)
            ? `<button type="button" class="btn btn-sm btn-soft-accent" data-act="desbloquear" data-sid="${esc(e.id)}">▶ Retomar</button>` : ''}
          <button type="button" class="btn btn-ghost btn-sm" data-goto-agent="${esc(e.id)}">⚙ Ver detalhes do agente</button>
        </div>
        <div class="ins-sec">
          <h4>Resumo da entrega</h4>
          <div class="ins-box">${esc(e.afirmacao || e.descricao || 'Sem resumo registrado.')}</div>
        </div>
        <div class="ins-sec">
          <h4>Como conferir</h4>
          <div class="ins-box">
            <div>${esc(e.verificacao || '—')}</div>
            <div class="muted" style="font-size:12px">Libera: <b>${esc(unlockStr)}</b></div>
          </div>
        </div>
        <div class="ins-sec">
          <h4>Arquivos anexados (${evs.length})</h4>
          <div class="ins-box">
            ${evs.length ? evs.map(ev => `<div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><span title="${esc(ev.ref)}">📄 ${esc(baseName(ev.ref))}</span><span class="st-pill ${ev.estado === 'ok' ? 'st-verificado' : 'st-bloqueado'} nob">${ev.estado === 'ok' ? 'Pronto' : esc(ev.estado)}</span></div>`).join('') : '<span class="muted">Nenhum arquivo anexado ainda.</span>'}
          </div>
        </div>
      </aside>`;
    }

    return `<aside class="inspector" aria-label="Detalhes do bloco">
      <div class="ins-head">
        <div class="wrap-any">
          <span class="code-tag">${esc(mod.id)}</span>
          <h3 style="margin-top:6px">${esc(mod.titulo)}</h3>
        </div>
        <button type="button" class="icon-btn" id="btn-close-ins" title="Fechar">×</button>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <span class="st-pill st-${esc(mod._status_mod)}">${esc(ST_LABEL[mod._status_mod] || mod._status_mod)}</span>
        ${ct.hash ? `<span class="st-pill st-verificado nob">🔒 Critérios travados</span>` : (canLock && canWrite() ? `<button type="button" class="btn btn-soft-accent btn-xs" data-lock-mod="${esc(mod.id)}">🔒 Travar critérios</button>` : '')}
      </div>
      <div class="ins-sec"><h4>Objetivo</h4><div class="ins-box">${esc(mod.objetivo || '—')}</div></div>
      ${ct.pergunta || (ct.criterios_aceitacao || []).length ? `<div class="ins-sec"><h4>Critérios de aprovação</h4><div class="ins-box">
        ${ct.pergunta ? `<div><b>Pergunta:</b> ${esc(ct.pergunta)}</div>` : ''}

      </div></div>` : ''}
    </aside>`;
  }

  function renderProjeto(){
    const fases = fasesList();
    const mods = D.estado.modulos || [];
    const sit = D.situacao_atual || {};
    const q = UI.projetoSearch.trim().toLowerCase();
    const activeMod = UI.hoverModId || UI.selectedModId;
    const conn = getConnectedModSet(activeMod);
    const hasInspector = !!(UI.selectedStageId || UI.selectedModId);

    function modMatches(m){
      const fOk = UI.projetoFiltro === 'todos'
        || (UI.projetoFiltro === 'bloqueado' && (m._status_mod === 'bloqueado' || (m._bloqueios_sistema || []).length > 0))
        || (UI.projetoFiltro === 'aguarda' && (m._status_mod === 'aguarda' || (m.etapas || []).some(e => ['executado','revisado','aguardando_decisao'].includes(e._status))))
        || m._status_mod === UI.projetoFiltro;
      if (!fOk) return false;
      if (!q) return true;
      return (m.id + ' ' + m.titulo + ' ' + (m.etapas || []).map(e => e.id + ' ' + e.titulo).join(' ')).toLowerCase().includes(q);
    }

    const toolbar = `<div class="canvas-bar">
      <div class="canvas-bar-group">
        <input class="search-in" id="proj-search" type="search" value="${esc(UI.projetoSearch)}" placeholder="Buscar etapa...">
        ${[['todos','Todos'],['aguarda','Para decidir'],['bloqueado','Pausados'],['verificado','Aprovados']].map(([k, l]) =>
          `<button type="button" class="btn btn-xs ${UI.projetoFiltro === k ? 'btn-soft-accent' : ''}" data-pfilter="${k}">${l}</button>`
        ).join('')}
      </div>
      <div class="canvas-bar-group">
        ${UI.projetoModo === 'fluxo' ? `
          <button type="button" class="btn btn-xs" id="btn-z-out" title="Diminuir zoom">−</button>
          <span class="muted" style="font-size:12px;min-width:40px;text-align:center">${Math.round(UI.zoom * 100)}%</span>
          <button type="button" class="btn btn-xs" id="btn-z-in" title="Aumentar zoom">+</button>
          <button type="button" class="btn btn-xs" id="btn-z-reset">Ajustar</button>
        ` : ''}
        <button type="button" class="btn btn-xs" id="btn-exp-all">${UI.expandedModules.size >= mods.length ? 'Recolher detalhes' : 'Abrir etapas'}</button>
        <button type="button" class="btn btn-xs btn-soft-accent" id="btn-proj-mode">${UI.projetoModo === 'fluxo' ? 'Ver em lista' : 'Ver mapa'}</button>
      </div>
    </div>`;

    if (UI.projetoModo === 'lista') {
      const listHtml = fases.map(f => {
        const fMods = mods.filter(m => (m.fase || '—') === f && modMatches(m));
        if (!fMods.length) return '';
        return `<div class="card">
          <h3>${esc(f)}</h3>
          ${fMods.map(m => `<div class="qrows" style="border:1px solid var(--line);border-radius:12px">
            <div style="padding:10px 14px;background:var(--surface-2);display:flex;justify-content:space-between;align-items:center;gap:8px;border-radius:12px 12px 0 0">
              <b>${esc(m.titulo)}</b>
              <span class="st-pill st-${esc(m._status_mod)}">${esc(ST_LABEL[m._status_mod] || m._status_mod)}</span>
            </div>
            ${(m.etapas || []).map(e => `<div class="qrow">
              <div class="qrow-main"><div class="qrow-title"><span>${esc(e.titulo)}</span><span class="code-tag">${esc(e.id)}</span></div><div class="qrow-sub"><span class="st-pill st-${esc(e._status)}">${esc(ST_LABEL[e._status] || e._status)}</span></div></div>
              <div class="qrow-actions">${renderRowActions(e, 'l-' + e.id)}</div>
            </div>`).join('')}
          </div>`).join('')}
        </div>`;
      }).join('');
      return `<div class="main">${toolbar}${listHtml}</div>`;
    }

    const lanesHtml = fases.map((f, idx) => {
      const fMods = mods.filter(m => (m.fase || '—') === f);
      const isExpPhase = UI.expandedPhases.has(f);
      const isCur = f === sit.fase_atual;
      const totF = fMods.reduce((a, m) => a + ((m.etapas || []).length || m.etapas_estimadas || 0), 0);
      const verF = fMods.reduce((a, m) => a + (m.etapas || []).filter(e => e._status === 'verificado').length, 0);

      const modsHtml = isExpPhase ? fMods.map(m => {
        const mOpen = UI.expandedModules.has(m.id);
        const dim = !modMatches(m) || (activeMod && activeMod !== m.id && !conn.up.has(m.id) && !conn.down.has(m.id));
        const hot = activeMod && (activeMod === m.id || conn.up.has(m.id) || conn.down.has(m.id));
        const ets = m.etapas || [];
        const verM = ets.filter(e => e._status === 'verificado').length;
        return `<div class="mod-node st-n-${esc(m._status_mod)} ${m.resultado_final ? 'is-final' : ''} ${dim ? 'is-dim' : ''} ${hot ? 'is-hot' : ''}" id="node-mod-${esc(m.id)}" data-hover-mod="${esc(m.id)}">

            </div>
            <div class="mod-title clamp2" title="${esc(m.titulo)}">${esc(m.titulo)}</div>
            <div class="muted" style="font-size:12px;display:flex;justify-content:space-between">
              <span>${ets.length ? `${verM} de ${ets.length} aprovadas` : `~${m.etapas_estimadas || 0} previstas`}</span>
              <span>${mOpen ? 'Recolher ▴' : 'Ver etapas ▾'}</span>
            </div>
          </button>

  function drawArchEdges(){
    const svg = document.getElementById('arch-svg');
    const world = document.getElementById('arch-world');
    if (!svg || !world) return;
    const z = UI.zoom || 1;
    const wr = world.getBoundingClientRect();
    svg.setAttribute('width', world.scrollWidth);
    svg.setAttribute('height', world.scrollHeight);

    const activeMod = UI.hoverModId || UI.selectedModId;
    const isMobile = window.innerWidth <= 760;
    let defs = `<defs>
      <marker id="ar-seq" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="var(--edge)"/></marker>
      <marker id="ar-blk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="var(--block)"/></marker>
      <marker id="ar-up"  viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="var(--accent)"/></marker>
      <marker id="ar-dn"  viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="var(--exe)"/></marker>
    </defs>`;

    let paths = '';
    for (const rel of (D.relacoes_mapa || [])) {
      const elA = document.getElementById('node-mod-' + rel.de);
      const elB = document.getElementById('node-mod-' + rel.para);
      if (!elA || !elB) continue;
      const A = elA.getBoundingClientRect(), B = elB.getBoundingClientRect();
      const axL = (A.left - wr.left) / z, axR = (A.right - wr.left) / z, axC = (axL + axR) / 2;
      const ayT = (A.top - wr.top) / z, ayB = (A.bottom - wr.top) / z, ayC = (ayT + ayB) / 2;
      const bxL = (B.left - wr.left) / z, bxR = (B.right - wr.left) / z, bxC = (bxL + bxR) / 2;
      const byT = (B.top - wr.top) / z, byB = (B.bottom - wr.top) / z, byC = (byT + byB) / 2;

      let d = '';
      if (isMobile || Math.abs(axC - bxC) < 40) {
        const x1 = axC, y1 = ayB + 2, x2 = bxC, y2 = byT - 4, my = (y1 + y2) / 2;
        d = `M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}`;
      } else if (bxL >= axR - 6) {
        const span = bxL - axR;
        if (span > 140) {
          const x1 = axC, y1 = ayB + 2, x2 = bxL - 4, y2 = byC, lowY = Math.max(ayB, byB) + 26;
          d = `M${x1},${y1} C${x1},${lowY} ${x2 - 54},${lowY} ${x2},${y2}`;
        } else {
          const x1 = axR + 2, y1 = ayC, x2 = bxL - 4, y2 = byC, dx = Math.max(24, span * 0.5);
          d = `M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}`;
        }
      } else {
        const x1 = axR + 2, y1 = ayC, x2 = bxR + 4, y2 = byC, cx = Math.max(x1, x2) + 28;
        d = `M${x1},${y1} C${cx},${y1} ${cx},${y2} ${x2},${y2}`;
      }
      const isBlk = rel.ativa || rel.tipo === 'bloqueante';
      let cls = isBlk ? 'e-block' : 'e-seq', mk = isBlk ? 'ar-blk' : 'ar-seq';
      if (activeMod) {
        if (rel.para === activeMod) { cls = isBlk ? 'e-hot-block' : 'e-hot-up'; mk = isBlk ? 'ar-blk' : 'ar-up'; }
        else if (rel.de === activeMod) { cls = isBlk ? 'e-hot-block' : 'e-hot-down'; mk = isBlk ? 'ar-blk' : 'ar-dn'; }
        else cls += ' e-dim';
      }
      paths += `<path class="${cls}" d="${d}" marker-end="url(#${mk})"/>`;
    }
    svg.innerHTML = defs + paths;
  }

  // ==================== REVISÃO CONTEXTUAL ====================
  function renderEvidenceBody(ev){
    if (!ev) return '<p class="muted">Nenhum arquivo anexado.</p>';
    if (ev.estado === 'ausente') return `<div class="alert-strip">Arquivo não encontrado no disco: <code>${esc(ev.ref)}</code>.</div>`;
    if (ev.estado === 'caminho_invalido') return `<div class="alert-strip">Caminho fora da pasta do projeto: <code>${esc(ev.ref)}</code>.</div>`;
    if (ev.tipo === 'remota') return `<div class="ins-box"><b>Link externo:</b> <a href="${esc(ev.ref)}" target="_blank" rel="noopener">${esc(ev.ref)}</a><div class="muted">${ev.versao ? 'Versão: ' + esc(ev.versao) : 'Alterações externas não são detectadas automaticamente.'}</div></div>`;
    if (ev.tipo === 'referencia_logica') return `<div class="ins-box"><b>Referência:</b> ${esc(ev.ref)} ${esc(ev.descricao || '')}</div>`;

    const meta = `<div class="muted" style="font-size:12px" title="${esc(ev.ref)}">📄 <b>${esc(baseName(ev.ref))}</b> · ${ev.bytes != null ? (ev.bytes / 1024).toFixed(1) + ' KB' : ''} · integridade verificada</div>`;
    if (!D.modo_servidor) return `${meta}<div class="ins-box">Abra pelo servidor local (<code>serve --open</code>) para visualizar figuras, tabelas e relatórios diretamente aqui.</div>`;

    if (ev.midia === 'imagem') {
      const src = '/api/evidencia?ref=' + encodeURIComponent(ev.ref) + '&v=' + encodeURIComponent(ev.sha256 || '');
      return `${meta}<img class="ev-img" src="${src}" alt="${esc(baseName(ev.ref))}" data-zoom-img="${src}">`;
    }
    const cached = UI.reviewEvidenceCache[ev.ref];
    if (!cached || cached.loading) return `${meta}<p class="muted">Carregando visualização...</p>`;
    if (cached.erro) return `${meta}<div class="alert-strip">${esc(cached.erro)}</div>`;
    if (cached.midia === 'tabela') {
      return `${meta}<div class="ev-table-wrap"><table class="ev-table"><thead><tr>${(cached.headers || []).map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${(cached.rows || []).map(r => `<tr>${r.map(v => `<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${cached.truncado ? `<span class="muted" style="font-size:12px">Mostrando as primeiras ${cached.max_linhas} linhas.</span>` : ''}`;
    }
    if (cached.midia === 'markdown') return `${meta}<div class="ev-md">${renderMarkdownSafe(cached.conteudo)}</div>`;
    return `${meta}<pre style="margin:0;overflow:auto;max-height:400px;background:var(--surface);padding:12px;border-radius:8px;border:1px solid var(--line)">${esc(cached.conteudo || '')}</pre>`;
  }
