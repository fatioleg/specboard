<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SpecBoard</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%230891b2'/%3E%3Cstop offset='100%25' stop-color='%232563eb'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Ctext x='16' y='21' text-anchor='middle' fill='%23fff' font-family='system-ui,sans-serif' font-size='14' font-weight='800'%3ESB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* SpecBoard v2.1 — Experiência calma, legível, com sidebar na Home, localizador Onde Estou e Harness visual.
   Gerado a partir de .specboard/estado.json — não edite o HTML gerado. */
:root{
  --bg:#f8fafc; --canvas-dot:rgba(15,23,42,.075);
  --surface:#ffffff; --surface-2:#f1f5f9; --surface-glass:rgba(255,255,255,.92);
  --fg:#0f172a; --muted:#475569; --line:#e2e8f0; --line-strong:#cbd5e1;
  --accent:#0891b2; --accent-soft:rgba(8,145,178,.11); --accent-glow:rgba(8,145,178,.28);
  --ok:#059669; --ok-soft:rgba(5,150,105,.12);
  --exe:#d97706; --exe-soft:rgba(217,119,6,.13);
  --rev:#2563eb; --rev-soft:rgba(37,99,235,.12);
  --pause:#7c3aed; --pause-soft:rgba(124,58,237,.12);
  --run:#2563eb; --run-soft:rgba(37,99,235,.12);
  --block:#e11d48; --block-soft:rgba(225,29,72,.11);
  --wait:#64748b; --wait-soft:rgba(100,116,139,.11);
  --edge:#94a3b8;
  --shadow:0 1px 3px rgba(15,23,42,.05), 0 6px 20px rgba(15,23,42,.04);
  --shadow-lg:0 16px 40px rgba(15,23,42,.13);
  --f-display:"Plus Jakarta Sans","Inter","Segoe UI",system-ui,sans-serif;
  --f-body:"Inter","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b101b; --canvas-dot:rgba(148,163,184,.10);
  --surface:#121928; --surface-2:#182234; --surface-glass:rgba(18,25,40,.92);
  --fg:#f1f5f9; --muted:#94a3b8; --line:rgba(148,163,184,.16); --line-strong:rgba(148,163,184,.30);
  --accent:#22d3ee; --accent-soft:rgba(34,211,238,.13); --accent-glow:rgba(34,211,238,.32);
  --ok:#34d399; --ok-soft:rgba(52,211,153,.14);
  --exe:#fbbf24; --exe-soft:rgba(251,191,36,.14);
  --rev:#60a5fa; --rev-soft:rgba(96,165,250,.14);
  --pause:#a78bfa; --pause-soft:rgba(167,139,250,.15);
  --run:#60a5fa; --run-soft:rgba(96,165,250,.15);
  --block:#fb7185; --block-soft:rgba(251,113,133,.14);
  --wait:#94a3b8; --wait-soft:rgba(148,163,184,.13);
  --edge:#475569; --shadow:0 2px 10px rgba(0,0,0,.30); --shadow-lg:0 20px 48px rgba(0,0,0,.55);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b101b; --canvas-dot:rgba(148,163,184,.10);
  --surface:#121928; --surface-2:#182234; --surface-glass:rgba(18,25,40,.92);
  --fg:#f1f5f9; --muted:#94a3b8; --line:rgba(148,163,184,.16); --line-strong:rgba(148,163,184,.30);
  --accent:#22d3ee; --accent-soft:rgba(34,211,238,.13); --accent-glow:rgba(34,211,238,.32);
  --ok:#34d399; --ok-soft:rgba(52,211,153,.14);
  --exe:#fbbf24; --exe-soft:rgba(251,191,36,.14);
  --rev:#60a5fa; --rev-soft:rgba(96,165,250,.14);
  --pause:#a78bfa; --pause-soft:rgba(167,139,250,.15);
  --run:#60a5fa; --run-soft:rgba(96,165,250,.15);
  --block:#fb7185; --block-soft:rgba(251,113,133,.14);
  --wait:#94a3b8; --wait-soft:rgba(148,163,184,.13);
  --edge:#475569; --shadow:0 2px 10px rgba(0,0,0,.30); --shadow-lg:0 20px 48px rgba(0,0,0,.55);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);font:14px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,h4{margin:0;font-family:var(--f-display);letter-spacing:-.015em}
p{margin:0}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code,pre,.mono{font-family:var(--f-mono);font-size:12px}
.muted{color:var(--muted)}
.wrap-any{min-width:0;overflow-wrap:anywhere;word-break:break-word}
.clamp1{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

.shell{min-height:100vh;display:flex;flex-direction:column}

/* === BARRA SUPERIOR COM BOTÃO HOME SEMPRE VISÍVEL === */
.nav{position:sticky;top:0;z-index:45;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 22px;background:var(--surface-glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.nav-left,.nav-right{display:flex;align-items:center;gap:9px;min-width:0}
.brand-btn{display:inline-flex;align-items:center;gap:9px;background:none;border:0;padding:2px 4px;border-radius:10px;cursor:pointer;text-align:left;min-width:0}
.brand-btn:hover{background:var(--surface-2)}
.brand-logo{width:32px;height:32px;border-radius:9px;object-fit:cover;border:1px solid var(--line-strong);box-shadow:0 2px 8px rgba(0,0,0,.18);flex:0 0 auto;background:#021324}
.proj-title{font:700 15px var(--f-display);max-width:290px}
.home-quick-btn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);border-radius:9px;padding:5px 11px;font-size:12.5px;font-weight:700;cursor:pointer;transition:all .14s;white-space:nowrap}
.home-quick-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.home-quick-btn.is-away{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.q-toggle{border:1px solid var(--line);background:var(--surface-2);color:var(--muted);border-radius:99px;padding:4px 10px;font-size:12px;cursor:pointer;transition:all .15s;white-space:nowrap}
.q-toggle:hover{border-color:var(--accent);color:var(--fg)}

.seg-tabs{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg-tab{border:0;background:transparent;color:var(--muted);padding:6px 14px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:all .14s;white-space:nowrap}
.seg-tab:hover{color:var(--fg)}
.seg-tab[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.seg-badge{background:var(--exe-soft);color:var(--exe);border-radius:99px;padding:1px 7px;font-size:11px;font-weight:700}

.pill-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:12.5px;font-weight:600;cursor:pointer;transition:all .14s;white-space:nowrap}
.pill-btn:hover{border-color:var(--accent)}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border:1px solid var(--line);background:var(--surface);border-radius:9px;cursor:pointer;font-size:14px;transition:all .14s}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.dot-live{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.dot-static{width:7px;height:7px;border-radius:50%;background:var(--wait)}

.q-drawer{padding:11px 22px;background:var(--surface-2);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:13.5px}
.offline-tip{padding:9px 22px;background:var(--surface-2);border-bottom:1px solid var(--line);font-size:13px;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* === CONTAINER === */
.main{width:100%;max-width:1320px;margin:0 auto;padding:20px 22px 44px;display:grid;gap:18px;flex:1}
.main.full-bleed{max-width:1660px}

/* === BOTÕES === */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;transition:all .14s;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px)}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none}
.btn-accent{background:var(--accent);border-color:var(--accent);color:#04131c}
.btn-accent:hover:not(:disabled){filter:brightness(1.06)}
.btn-ok{background:var(--ok);border-color:var(--ok);color:#031c13}
.btn-ok:hover:not(:disabled){filter:brightness(1.06)}
.btn-soft-ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.btn-soft-ok:hover:not(:disabled){border-color:var(--ok)}
.btn-soft-warn{background:var(--exe-soft);border-color:transparent;color:var(--exe)}
.btn-soft-warn:hover:not(:disabled){border-color:var(--exe)}
.btn-soft-pause{background:var(--pause-soft);border-color:transparent;color:var(--pause)}
.btn-soft-pause:hover:not(:disabled){border-color:var(--pause)}
.btn-soft-block{background:var(--block-soft);border-color:transparent;color:var(--block)}
.btn-soft-block:hover:not(:disabled){border-color:var(--block)}
.btn-soft-accent{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.btn-soft-accent:hover:not(:disabled){border-color:var(--accent)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn-ghost:hover:not(:disabled){background:var(--surface-2);color:var(--fg);border-color:transparent;transform:none}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
.btn-xs{padding:4px 9px;font-size:12px;border-radius:7px}

/* === STATUS PILLS === */
.st-pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 9px;font-size:11.5px;font-weight:600;white-space:nowrap}
.st-pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-pill.nob::before{display:none}
.st-verificado{background:var(--ok-soft);color:var(--ok)}
.st-revisado{background:var(--rev-soft);color:var(--rev)}
.st-executado,.st-aguarda{background:var(--exe-soft);color:var(--exe)}
.st-aguardando_decisao{background:var(--pause-soft);color:var(--pause)}
.st-em_curso,.st-parcial{background:var(--run-soft);color:var(--run)}
.st-bloqueado,.st-correcao_solicitada{background:var(--block-soft);color:var(--block)}
.st-pendente{background:var(--wait-soft);color:var(--wait)}
.st-code{background:var(--pause-soft);color:var(--pause)}
.st-accent{background:var(--accent-soft);color:var(--accent)}
.code-tag{font:600 11.5px var(--f-mono);color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;white-space:nowrap}

/* === MENU "⋯" === */
.menu-wrap{position:relative;display:inline-flex}
.menu-pop{position:absolute;right:0;top:calc(100% + 5px);z-index:60;min-width:205px;background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;padding:6px;box-shadow:var(--shadow-lg);display:grid;gap:2px}
.menu-item{border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:8px;color:var(--fg)}
.menu-item:hover{background:var(--surface-2)}
.menu-item.danger{color:var(--block)}
.menu-sep{height:1px;background:var(--line);margin:4px 0}

/* === CARDS === */
.card{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:18px 20px;box-shadow:var(--shadow);display:grid;gap:12px;min-width:0}
.alert-strip{background:var(--block-soft);border:1px solid var(--block);color:var(--fg);border-radius:12px;padding:12px 15px;font-size:13.5px}

/* === HOME (AGORA) COM SIDEBAR LATERAL DE ÁREAS DO PROJETO === */
.home-shell{display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px;align-items:start}
.home-sidebar{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);display:grid;gap:16px;position:sticky;top:72px;max-height:calc(100vh - 90px);overflow-y:auto;min-width:0}
.sb-group-brand{display:flex;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.sb-group-logo{width:50px;height:50px;border-radius:12px;object-fit:cover;border:1px solid var(--line-strong);box-shadow:0 4px 12px rgba(0,0,0,.22);flex:0 0 auto;background:#021324}
.sb-sec{display:grid;gap:6px}
.sb-sec-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:0 6px}
.sb-nav-btn{border:1px solid transparent;background:transparent;border-radius:10px;padding:8px 10px;text-align:left;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;font-weight:600;color:var(--fg);transition:all .13s;width:100%}
.sb-nav-btn:hover{background:var(--surface-2);border-color:var(--line)}
.sb-area-btn{border:1px solid var(--line);background:var(--surface-2);border-radius:11px;padding:9px 11px;text-align:left;cursor:pointer;display:grid;gap:4px;transition:all .14s;width:100%}
.sb-area-btn:hover{border-color:var(--accent);background:var(--surface)}
.sb-area-btn.is-current{border-color:var(--accent);background:linear-gradient(135deg,var(--accent-soft),var(--surface));box-shadow:0 0 0 1px var(--accent)}
.sb-area-top{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);font-weight:700}
.sb-area-title{font-size:13px;font-weight:700;line-height:1.3;color:var(--fg)}
.home-content{display:grid;gap:18px;min-width:0}

/* KPIs da Home SEM CORTAR TEXTO */
.kpi-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.kpi-box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px 17px;box-shadow:var(--shadow);display:grid;gap:8px;min-width:0;align-content:start}
.kpi-lbl{font-size:12px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.kpi-val{font:700 16px var(--f-display);line-height:1.3}
.kpi-sub{font-size:12.5px;line-height:1.45;color:var(--muted);overflow-wrap:anywhere}
.bar-slim{height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden;display:flex}
.bar-slim i{display:block;height:100%}

.focus-card{background:linear-gradient(135deg, var(--surface) 0%, var(--surface) 60%, var(--accent-soft) 100%);border:1px solid var(--accent-glow);border-radius:16px;padding:22px 24px;box-shadow:var(--shadow);display:grid;gap:13px}
.focus-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.focus-eyebrow{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--accent)}
.focus-title{font:700 20px/1.3 var(--f-display)}
.action-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-top:2px}

.queue-card{background:var(--surface);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}
.queue-head{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.qrows{display:grid}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line);transition:background .12s}
.qrow:last-child{border-bottom:0}
.qrow:hover{background:var(--surface-2)}
.qrow-main{display:grid;gap:5px;min-width:0}
.qrow-title{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;line-height:1.35}
.qrow-sub{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.qrow-actions{display:flex;align-items:center;gap:7px;flex-shrink:0}

.bottom-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.compact-list{display:grid;gap:8px}
.compact-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-size:13px}
.compact-row.is-block{border-left:3px solid var(--block)}

/* === ABA PROJETO — MAPA ARCHIFY LEGÍVEL + LOCALIZADOR ONDE ESTOU === */
.canvas-shell{display:grid;gap:12px}
.canvas-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.canvas-bar-group{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.search-in{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 11px;font-size:13px;width:210px}
.search-in:focus{border-color:var(--accent);outline:none;background:var(--surface)}

.workspace-split{position:relative;display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start}
.workspace-split.with-inspector{grid-template-columns:minmax(0,1fr) 380px}

.arch-viewport{position:relative;background-color:var(--bg);background-image:radial-gradient(var(--canvas-dot) 1.25px, transparent 1.25px);background-size:20px 20px;border:1px solid var(--line);border-radius:16px;overflow:auto;min-height:540px;max-height:76vh;padding:20px}
.arch-world{position:relative;display:inline-flex;gap:24px;align-items:flex-start;transform-origin:0 0;min-width:max-content;padding:6px 12px 42px 6px}
svg.arch-svg{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:visible}
svg.arch-svg path{fill:none;transition:opacity .18s,stroke .18s,stroke-width .18s}
svg.arch-svg path.e-seq{stroke:var(--edge);stroke-width:1.75}
svg.arch-svg path.e-block{stroke:var(--block);stroke-width:2.25;stroke-dasharray:6 4}
svg.arch-svg path.e-hot-up{stroke:var(--accent);stroke-width:2.8;stroke-dasharray:none}
svg.arch-svg path.e-hot-down{stroke:var(--exe);stroke-width:2.8;stroke-dasharray:none}
svg.arch-svg path.e-hot-block{stroke:var(--block);stroke-width:3;stroke-dasharray:none}
svg.arch-svg path.e-dim{opacity:.14}

/* Largura generosa (272px) para NENHUM card esmagar texto */
.lane{position:relative;z-index:2;width:272px;flex:0 0 auto;display:grid;gap:14px}
.lane-head{background:var(--surface);border:1.5px solid var(--line);border-radius:13px;padding:12px 14px;cursor:pointer;display:grid;gap:5px;box-shadow:var(--shadow);transition:all .16s;text-align:left}
.lane-head:hover{border-color:var(--accent)}
.lane-head.is-current{border:2px solid var(--accent);background:linear-gradient(135deg, var(--accent-soft), var(--surface));box-shadow:0 0 0 3px var(--accent-soft), var(--shadow-lg)}
.lane-head-top{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);font-weight:700}
.lane-title{font:700 14.5px/1.3 var(--f-display)}
.here-badge{display:inline-flex;align-items:center;gap:4px;background:var(--accent);color:#04131c;border-radius:99px;padding:2px 8px;font-size:10.5px;font-weight:800;letter-spacing:.02em;white-space:nowrap}

.mod-node{position:relative;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);display:grid;gap:10px;transition:all .15s}
.mod-node::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--node-accent,var(--wait))}
.mod-node:hover{border-color:var(--line-strong);transform:translateY(-1px)}
.mod-node.is-final{box-shadow:0 0 0 1.5px var(--accent), var(--shadow)}
.mod-node.is-dim{opacity:.24}
.mod-node.is-hot{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft), var(--shadow)}
.mod-node.is-selected{border:2px solid var(--accent);background:linear-gradient(180deg, var(--accent-soft) 0%, var(--surface) 38%);box-shadow:0 0 0 4px var(--accent-soft), var(--shadow-lg)}
.mod-node.st-n-verificado{--node-accent:var(--ok)}
.mod-node.st-n-aguarda{--node-accent:var(--exe)}
.mod-node.st-n-em_curso{--node-accent:var(--run)}
.mod-node.st-n-bloqueado{--node-accent:var(--block)}
.mod-node.st-n-pendente,.mod-node.st-n-parcial{--node-accent:var(--wait)}

.mod-head-btn{background:none;border:0;padding:0;text-align:left;cursor:pointer;display:grid;gap:6px;width:100%}
.mod-meta{display:flex;justify-content:space-between;align-items:center;gap:6px}
.mod-title{font:700 14px/1.35 var(--f-display)}

.stages-wrap{display:grid;gap:9px;padding-top:10px;border-top:1px dashed var(--line)}
.st-card{background:var(--surface-2);border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;display:grid;gap:7px;cursor:pointer;transition:all .14s}
.st-card:hover{border-color:var(--accent)}
.st-card.is-sel{border:2px solid var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft), 0 8px 22px rgba(0,0,0,.14)}
.st-card.is-here{border:2px solid var(--accent);background:linear-gradient(135deg, var(--accent-soft), var(--surface));box-shadow:0 0 0 4px var(--accent-soft)}
.st-card-top{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:nowrap}
.st-card-top .st-pill{font-size:10.5px;padding:2px 7px;white-space:nowrap}
.st-card-title{font-size:13px;font-weight:600;line-height:1.38}

/* Resumo legível em largura total (substitui as 3 caixinhas esmagadas!) */
.st-preview{display:grid;gap:7px;padding-top:8px;border-top:1px solid var(--line);font-size:12px;line-height:1.45}
.st-preview-meta{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;color:var(--muted);font-weight:600}
.st-preview-crit{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px 9px;color:var(--fg);overflow-wrap:anywhere}

/* === INSPETOR LATERAL DIREITO LEVE E AMIGÁVEL === */
.inspector{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow-lg);display:grid;gap:14px;max-height:76vh;overflow-y:auto;position:sticky;top:72px;min-width:0}
.ins-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;border-bottom:1px solid var(--line);padding-bottom:12px}
.ins-sec{display:grid;gap:7px;font-size:13.5px;min-width:0}
.ins-sec h4{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.ins-box{background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:12px 14px;display:grid;gap:8px;min-width:0;overflow-wrap:anywhere;word-break:break-word}
.check-list{display:grid;gap:7px;margin:0;padding:0;list-style:none}
.check-item{display:flex;gap:8px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:12.5px;line-height:1.45}
.check-ic{color:var(--accent);font-weight:800;flex:0 0 auto;margin-top:1px}
details.clean-fold{border:1px solid var(--line);border-radius:10px;padding:8px 11px;background:var(--surface-2)}
details.clean-fold summary{cursor:pointer;font-size:12.5px;font-weight:700;color:var(--accent);list-style:none;display:flex;align-items:center;justify-content:space-between}
details.clean-fold[open] summary{margin-bottom:8px}

/* === REVISÃO CONTEXTUAL === */
.rev-grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
.rev-rail{position:sticky;top:72px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow-lg);display:grid;gap:13px;min-width:0}
.ev-stage{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:14px;display:grid;gap:10px;overflow-x:auto}
.ev-img{max-width:100%;max-height:520px;object-fit:contain;border-radius:8px;background:#fff;border:1px solid var(--line);cursor:zoom-in}
.ev-table-wrap{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.ev-table{border-collapse:collapse;width:100%;font-size:12.5px;font-family:var(--f-mono)}
.ev-table th,.ev-table td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.ev-table th{position:sticky;top:0;background:var(--surface-2);font-weight:700}
.ev-md{font-size:14px;line-height:1.6;display:grid;gap:8px}
.ev-md pre{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;margin:0}
.ev-md ul{margin:0;padding-left:18px}

/* === ABA HARNESS & AGENTE (ESTRUTURADA, AMIGÁVEL E POR ENTIDADE) === */
.harness-hero{background:linear-gradient(135deg, var(--surface) 0%, var(--surface) 58%, var(--accent-soft) 100%);border:1px solid var(--accent-glow);border-radius:16px;padding:20px 22px;box-shadow:var(--shadow);display:grid;gap:14px}
.stat-pills{display:flex;flex-wrap:wrap;gap:8px}
.stat-chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;padding:6px 11px;font-size:12.5px;font-weight:700;cursor:pointer;transition:all .13s}
.stat-chip:hover{border-color:var(--accent);transform:translateY(-1px)}
.stat-chip.is-active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}

.arch-pillars{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.pillar-card{background:var(--surface);border:1.5px solid var(--line);border-radius:13px;padding:12px;text-align:left;cursor:pointer;display:grid;gap:4px;position:relative;transition:all .14s;box-shadow:var(--shadow)}
.pillar-card::before{content:"";position:absolute;top:0;left:10px;right:10px;height:3px;border-radius:0 0 3px 3px;background:var(--pc,var(--accent))}
.pillar-card:hover,.pillar-card.is-active{border-color:var(--pc,var(--accent));transform:translateY(-1px);box-shadow:0 0 0 2px var(--accent-soft), var(--shadow)}
.pillar-ic{font-size:17px}
.pillar-t{font:700 13px/1.25 var(--f-display)}
.pillar-s{font-size:11.5px;color:var(--muted)}

.entity-section{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:18px 20px;box-shadow:var(--shadow);display:grid;gap:14px}
.entity-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px}
.entity-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.entity-card{background:var(--surface-2);border:1px solid var(--line);border-top:3px solid var(--ec,var(--accent));border-radius:12px;padding:13px 14px;display:grid;gap:7px;align-content:start;min-width:0;overflow-wrap:anywhere}
.entity-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.entity-name{font:700 13.5px/1.3 var(--f-display)}
.entity-desc{font-size:12.5px;line-height:1.45;color:var(--fg)}
.entity-foot{display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding-top:4px}

.flow-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:12px}
.flow-phase{background:var(--surface-2);border:1px solid var(--line);border-radius:13px;padding:13px;display:grid;gap:9px;align-content:start}
.flow-mod{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 11px;display:grid;gap:5px;cursor:pointer;transition:all .13s;text-align:left;width:100%}
.flow-mod:hover{border-color:var(--accent)}

.agent-shell{display:grid;grid-template-columns:280px minmax(0,1fr);gap:18px;align-items:start}
.agent-rail{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:14px;box-shadow:var(--shadow);display:grid;gap:10px;max-height:78vh;overflow-y:auto;position:sticky;top:72px;min-width:0}
.rail-phase{display:grid;gap:4px}
.rail-phase-lbl{font-size:11px;font-weight:700;color:var(--muted);padding:6px 6px 2px;letter-spacing:.02em}
.rail-item{border:1px solid transparent;background:transparent;border-radius:9px;padding:8px 10px;text-align:left;cursor:pointer;display:grid;gap:3px;transition:all .12s;width:100%;min-width:0}
.rail-item:hover{background:var(--surface-2);border-color:var(--line)}
.rail-item.is-active{background:var(--accent-soft);border-color:var(--accent)}
.rail-item-title{font-size:13px;font-weight:600;line-height:1.35}
.agent-main{display:grid;gap:16px;min-width:0}
.agent-canvas{position:relative;background-color:var(--bg);background-image:radial-gradient(var(--canvas-dot) 1.25px, transparent 1.25px);background-size:20px 20px;border:1px solid var(--line);border-radius:16px;padding:16px;overflow:hidden}
.layer-grid{position:relative;display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:18px;z-index:2}
.layer-node{background:var(--surface);border:1.5px solid var(--line);border-radius:13px;padding:12px 14px;cursor:pointer;text-align:left;display:grid;gap:4px;box-shadow:var(--shadow);transition:all .14s;position:relative;min-width:0}
.layer-node::before{content:"";position:absolute;top:0;left:12px;right:12px;height:3px;border-radius:0 0 3px 3px;background:var(--layer-c,var(--accent))}
.layer-node:hover{border-color:var(--accent);transform:translateY(-1px)}
.layer-node.open{border-color:var(--accent);background:linear-gradient(135deg, var(--accent-soft), var(--surface));box-shadow:0 0 0 2px var(--accent-soft), var(--shadow)}
.clean-list{margin:0;padding-left:18px;display:grid;gap:6px}
.chip-row{display:flex;flex-wrap:wrap;gap:6px}
.file-chip{display:inline-flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:12px;max-width:100%}
.file-chip.is-btn{cursor:pointer}
.file-chip.is-btn:hover{border-color:var(--accent);color:var(--accent)}
.lineage{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lin-node{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12.5px}

/* === MODAIS, TOAST E FORMULÁRIOS === */
.input,.textarea{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13.5px}
.input:focus,.textarea:focus{border-color:var(--accent);outline:none;background:var(--surface)}
.textarea{min-height:76px;resize:vertical}
.modal-bg{position:fixed;inset:0;background:rgba(2,6,23,.58);backdrop-filter:blur(4px);z-index:70;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;display:grid;gap:14px;box-shadow:var(--shadow-lg)}
.toast{position:fixed;right:20px;bottom:20px;z-index:90;background:var(--surface);border:1px solid var(--accent);border-radius:12px;padding:11px 16px;box-shadow:var(--shadow-lg);font-size:13.5px;font-weight:600;max-width:420px}
.toast.err{border-color:var(--block);color:var(--block)}
.lightbox{position:fixed;inset:0;background:rgba(2,6,23,.88);z-index:95;display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
.lightbox img{max-width:95vw;max-height:92vh;background:#fff;border-radius:10px}

/* === RESPONSIVO === */
@media (max-width:1120px){
  .home-shell,.workspace-split.with-inspector,.rev-grid,.agent-shell{grid-template-columns:minmax(0,1fr)}
  .home-sidebar,.inspector,.rev-rail,.agent-rail{position:static;max-height:none}
  .arch-pillars{grid-template-columns:repeat(3,minmax(0,1fr))}
  .layer-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:760px){
  .kpi-strip,.bottom-two,.layer-grid,.arch-pillars{grid-template-columns:minmax(0,1fr)}
  .qrow{grid-template-columns:minmax(0,1fr);gap:8px}
  .arch-world{flex-direction:column;gap:20px;min-width:0;width:100%;padding:4px}
  .lane{width:100%}
  .proj-title{max-width:170px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}

  let toastTimer = null;
  function showToast(text, isErr){
    UI.toast = {text, err: !!isErr};
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { UI.toast = null; renderToastOnly(); }, 4200);
    renderToastOnly();
  }
  function renderToastOnly(){
    const old = document.getElementById('sb-toast');
    if (old) old.remove();
    if (!UI.toast) return;
    const div = document.createElement('div');
    div.id = 'sb-toast';
    div.className = 'toast' + (UI.toast.err ? ' err' : '');
    div.textContent = UI.toast.text;
    document.body.appendChild(div);

  function projectKey(k){ return 'specboard.v2.' + ((D.estado.projeto && D.estado.projeto.nome) || 'p') + '.' + k; }
  function getReviewer(){ try { return localStorage.getItem(projectKey('revisor')) || ''; } catch(e) { return ''; } }
  function setReviewer(v){ try { localStorage.setItem(projectKey('revisor'), (v || '').trim()); } catch(e) {} }
  function canWrite(){ return !!(D.modo_servidor && !(D.servidor && D.servidor.readonly)); }
  function getGroupLogo(){
    const custom = D.estado && D.estado.projeto && D.estado.projeto.logo;
    return custom || CEMOL_LOGO_URI;
  }

  function findStage(sid){
    for (const m of (D.estado.modulos || [])) {
      for (const e of (m.etapas || [])) if (e.id === sid) return {m, e};
    }
    return null;
  }
  function findMod(mid){ return (D.estado.modulos || []).find(m => m.id === mid) || null; }
  function allStages(){
    const out = [];
    for (const m of (D.estado.modulos || [])) for (const e of (m.etapas || [])) out.push({m, e});
    return out;
  }
  function fasesList(){
    const mods = D.estado.modulos || [];
    return (D.estado.fases && D.estado.fases.length) ? D.estado.fases : [...new Set(mods.map(m => m.fase || '—'))];
  }
  function formatUnlocks(list){
    if (!list || !list.length) return '';
    const mods = list.filter(x => x.tipo === 'modulo').map(x => x.titulo || x.id);
    const arr = mods.length ? mods : list.map(x => x.titulo || x.id);
    return arr.slice(0, 2).join(', ') + (arr.length > 2 ? ` (+${arr.length - 2})` : '');
  }
  function getWhereAmI(){
    const sit = D.situacao_atual || {};
    const prox = sit.proxima_acao || {};
    const ativ = sit.atividade_agente || {};
    const stageId = prox.etapa_id || sit.etapa_foco_id || ativ.etapa_id || null;
    const pair = stageId ? findStage(stageId) : null;
    const mod = (pair && pair.m) || (sit.modulo_atual_id ? findMod(sit.modulo_atual_id) : null);
    return {
      fase: (mod && mod.fase) || sit.fase_atual || fasesList()[0] || '—',
      modId: mod ? mod.id : null,
      stageId: pair ? pair.e.id : null,
      stageTitle: pair ? pair.e.titulo : (mod ? mod.titulo : '—')
    };
  }
  function goHome(){
    UI.openMenuId = null;
    UI.reviewStageId = null;
    UI.tab = 'agora';
    render();
    window.scrollTo({top: 0, behavior: 'smooth'});

  function focusWhereAmI(customPhase, customModId, customStageId){
    const cur = getWhereAmI();
    const fase = customPhase || cur.fase;
    const modId = customModId !== undefined ? customModId : cur.modId;
    const stageId = customStageId !== undefined ? customStageId : cur.stageId;
    UI.openMenuId = null;
    UI.reviewStageId = null;
    UI.tab = 'projeto';
    UI.projetoModo = 'fluxo';
    UI.projetoFiltro = 'todos';
    UI.projetoSearch = '';
    if (fase) UI.expandedPhases.add(fase);
    if (modId) {
      UI.expandedModules.add(modId);
      UI.selectedModId = modId;
    }
    UI.selectedStageId = stageId || null;
    UI.spotlightTargetId = stageId ? ('stage-node-' + stageId) : (modId ? ('node-mod-' + modId) : null);
    render();
    setTimeout(() => {
      const vp = document.getElementById('arch-viewport');
      const target = UI.spotlightTargetId
        ? document.getElementById(UI.spotlightTargetId)
        : document.querySelector('.lane-head.is-current');
      if (vp && target) {
        const vr = vp.getBoundingClientRect(), tr = target.getBoundingClientRect();
        vp.scrollTo({
          left: Math.max(0, vp.scrollLeft + (tr.left - vr.left) - (vp.clientWidth - tr.width) / 2),
          top: Math.max(0, vp.scrollTop + (tr.top - vr.top) - (vp.clientHeight - tr.height) / 2),
          behavior: 'smooth'
        });
      }
      window.scrollTo({top: 0, behavior: 'smooth'});
    }, 60);
  }

  (function init(){
    const sit = D.situacao_atual || {};
    fasesList().forEach(f => UI.expandedPhases.add(f));
    if (sit.modulo_atual_id) UI.expandedModules.add(sit.modulo_atual_id);
    const stages = allStages();
    const emCurso = stages.find(s => s.e._status === 'em_curso' && s.e._agente && s.e._agente.possui_definicao);
    const primeiraComArq = stages.find(s => s.e._agente && s.e._agente.possui_definicao);
    UI.agentStageId = (emCurso && emCurso.e.id) || (primeiraComArq && primeiraComArq.e.id) || sit.etapa_foco_id || (stages[0] && stages[0].e.id) || null;
  })();

  function getEffectiveMudancas(){
    if (D.mudancas && D.mudancas.referencia_confiavel) return D.mudancas;
    try {
      const saved = JSON.parse(localStorage.getItem(projectKey('visita')) || 'null');
      if (saved && Array.isArray(saved.event_ids)) {
        const seen = new Set(saved.event_ids);
        return {referencia_confiavel: true, referencia_em: saved.registrada_em || '', novos: (D.eventos || []).filter(e => !seen.has(e.id))};
      }
    } catch(e) {}
    return {referencia_confiavel: false, referencia_em: '', novos: []};
  }

  async function apiPost(url, body){
    const token = (D.servidor && D.servidor.token) || '';
    const res = await fetch(url, {
      method: 'POST',
      headers: {'Content-Type':'application/json', 'X-Specboard-Token': token},
      body: JSON.stringify(body)
    });
    const data = await res.json().catch(() => ({}));
    return {status: res.status, data};
  }

  async function triggerAction(etapaId, acao, notaDireta){
    UI.openMenuId = null;
    if (!canWrite()) {
      showToast('Você abriu a cópia offline. Para salvar decisões, use o painel aberto pelo servidor local.', true);
      return;
    }
    const meta = ACAO_META[acao];
    if (!meta) return;
    const rev = getReviewer();
    const pair = findStage(etapaId);
    if (!pair) return;

    if ((meta.exigeNota && notaDireta === undefined) || !rev) {
      UI.actionModal = {etapaId, acao, titulo: pair.e.titulo, exigeNota: meta.exigeNota, precisaRevisor: !rev, notaInicial: notaDireta || ''};
      UI.actionError = '';
      render();
      setTimeout(() => {
        const inp = document.getElementById(!rev ? 'act-revisor' : 'act-nota');
        if (inp) inp.focus();
      }, 20);
      return;
    }
    await executeAction(etapaId, acao, rev, notaDireta || '');
  }

  async function executeAction(etapaId, acao, revisor, nota){
    const pair = findStage(etapaId);
    if (!pair) return;
    const fp = pair.e._snapshot && pair.e._snapshot.fingerprint_total;
    UI.actionBusy = true; UI.reviewBusy = true; UI.actionError = ''; UI.reviewConflictMsg = '';
    render();
    const {status, data} = await apiPost('/api/decisao', {
      etapa_id: etapaId, acao, revisor, nota, observed_fingerprint: fp
    });
    UI.actionBusy = false; UI.reviewBusy = false;
    if (status === 200 && data.payload) {
      D = data.payload;
      UI.actionModal = null;
      render();
      showToast(`✓ ${pair.e.titulo.slice(0, 42)} — ${ACAO_META[acao].okMsg}.`);
    } else if (status === 409 && data.payload) {
      D = data.payload;
      UI.actionModal = null;

  async function loadEvidencePreview(ref, midia){
    if (!D.modo_servidor || !ref || midia === 'imagem') return;
    if (UI.reviewEvidenceCache[ref]) return;
    UI.reviewEvidenceCache[ref] = {loading: true};
    render();
    try {

      UI.reviewEvidenceCache[ref] = res.ok ? data : {erro: data.erro || 'Erro ao carregar'};

  function renderMarkdownSafe(md){
    const lines = String(md || '').split(/\r?\n/);
    let html = '', inCode = false, inList = false;
    const inl = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    for (const raw of lines) {
      if (raw.trim().startsWith('```')) {
        if (inList) { html += '</ul>'; inList = false; }
        html += inCode ? '</code></pre>' : '<pre><code>';
        inCode = !inCode; continue;
      }
      if (inCode) { html += esc(raw) + '\n'; continue; }
      const t = raw.trim();
      if (!t) { if (inList) { html += '</ul>'; inList = false; } continue; }
      const hm = t.match(/^(#{1,4})\s+(.*)$/);
      if (hm) { if (inList) { html += '</ul>'; inList = false; } html += `<h${Math.min(4, hm[1].length + 1)}>${inl(hm[2])}</h${Math.min(4, hm[1].length + 1)}>`; }
      else if (/^[-*]\s+/.test(t)) { if (!inList) { html += '<ul>'; inList = true; } html += `<li>${inl(t.replace(/^[-*]\s+/, ''))}</li>`; }
      else { if (inList) { html += '</ul>'; inList = false; } html += `<p>${inl(t)}</p>`; }
    }
    if (inList) html += '</ul>';
    if (inCode) html += '</code></pre>';
    return html || '<p class="muted">(vazio)</p>';
  }

  }

  // ==================== ABA 2: PROJETO (MAPA LEGÍVEL + ONDE ESTOU + INSPETOR LIMPO) ====================
  function getConnectedModSet(modId){
    const up = new Set(), down = new Set();
    if (!modId) return {up, down};
    for (const r of (D.relacoes_mapa || [])) {
      if (r.para === modId) up.add(r.de);
      if (r.de === modId) down.add(r.para);
    }
    return {up, down};
  }

          ${mOpen ? `<div class="stages-wrap">

              const evN = (e._snapshot && e._snapshot.evidencias && e._snapshot.evidencias.length) || 0;

  function drawArchEdges(){
    const svg = document.getElementById('arch-svg');
    const world = document.getElementById('arch-world');
    if (!svg || !world) return;
    const z = UI.zoom || 1;
    const wr = world.getBoundingClientRect();
    svg.setAttribute('width', world.scrollWidth);
    svg.setAttribute('height', world.scrollHeight);

    const activeMod = UI.hoverModId || UI.selectedModId;
    const isMobile = window.innerWidth <= 760;
    let defs = `<defs>
      <marker id="ar-seq" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="var(--edge)"/></marker>
      <marker id="ar-blk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="var(--block)"/></marker>
      <marker id="ar-up"  viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="var(--accent)"/></marker>
      <marker id="ar-dn"  viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="var(--exe)"/></marker>
    </defs>`;

    let paths = '';
    for (const rel of (D.relacoes_mapa || [])) {
      const elA = document.getElementById('node-mod-' + rel.de);
      const elB = document.getElementById('node-mod-' + rel.para);
      if (!elA || !elB) continue;
      const A = elA.getBoundingClientRect(), B = elB.getBoundingClientRect();
      const axL = (A.left - wr.left) / z, axR = (A.right - wr.left) / z, axC = (axL + axR) / 2;
      const ayT = (A.top - wr.top) / z, ayB = (A.bottom - wr.top) / z, ayC = (ayT + ayB) / 2;
      const bxL = (B.left - wr.left) / z, bxR = (B.right - wr.left) / z, bxC = (bxL + bxR) / 2;
      const byT = (B.top - wr.top) / z, byB = (B.bottom - wr.top) / z, byC = (byT + byB) / 2;

      let d = '';
      if (isMobile || Math.abs(axC - bxC) < 40) {
        const x1 = axC, y1 = ayB + 2, x2 = bxC, y2 = byT - 4, my = (y1 + y2) / 2;
        d = `M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}`;
      } else if (bxL >= axR - 6) {
        const span = bxL - axR;
        if (span > 140) {
          const x1 = axC, y1 = ayB + 2, x2 = bxL - 4, y2 = byC, lowY = Math.max(ayB, byB) + 26;
          d = `M${x1},${y1} C${x1},${lowY} ${x2 - 54},${lowY} ${x2},${y2}`;
        } else {
          const x1 = axR + 2, y1 = ayC, x2 = bxL - 4, y2 = byC, dx = Math.max(24, span * 0.5);
          d = `M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}`;
        }
      } else {
        const x1 = axR + 2, y1 = ayC, x2 = bxR + 4, y2 = byC, cx = Math.max(x1, x2) + 28;
        d = `M${x1},${y1} C${cx},${y1} ${cx},${y2} ${x2},${y2}`;
      }
      const isBlk = rel.ativa || rel.tipo === 'bloqueante';
      let cls = isBlk ? 'e-block' : 'e-seq', mk = isBlk ? 'ar-blk' : 'ar-seq';
      if (activeMod) {
        if (rel.para === activeMod) { cls = isBlk ? 'e-hot-block' : 'e-hot-up'; mk = isBlk ? 'ar-blk' : 'ar-up'; }
        else if (rel.de === activeMod) { cls = isBlk ? 'e-hot-block' : 'e-hot-down'; mk = isBlk ? 'ar-blk' : 'ar-dn'; }
        else cls += ' e-dim';
      }
      paths += `<path class="${cls}" d="${d}" marker-end="url(#${mk})"/>`;
    }
    svg.innerHTML = defs + paths;
  }

  function renderEvidenceBody(ev){
    if (!ev) return '<p class="muted">Nenhum arquivo anexado.</p>';
    if (ev.estado === 'ausente') return `<div class="alert-strip">Arquivo não encontrado no disco: <code>${esc(ev.ref)}</code>.</div>`;
    if (ev.estado === 'caminho_invalido') return `<div class="alert-strip">Caminho fora da pasta do projeto: <code>${esc(ev.ref)}</code>.</div>`;
    if (ev.tipo === 'remota') return `<div class="ins-box"><b>Link externo:</b> <a href="${esc(ev.ref)}" target="_blank" rel="noopener">${esc(ev.ref)}</a><div class="muted">${ev.versao ? 'Versão: ' + esc(ev.versao) : 'Alterações externas não são detectadas automaticamente.'}</div></div>`;
    if (ev.tipo === 'referencia_logica') return `<div class="ins-box"><b>Referência:</b> ${esc(ev.ref)} ${esc(ev.descricao || '')}</div>`;

    const meta = `<div class="muted" style="font-size:12px" title="${esc(ev.ref)}">📄 <b>${esc(baseName(ev.ref))}</b> · ${ev.bytes != null ? (ev.bytes / 1024).toFixed(1) + ' KB' : ''} · integridade verificada</div>`;
    if (!D.modo_servidor) return `${meta}<div class="ins-box">Abra pelo servidor local (<code>serve --open</code>) para visualizar figuras, tabelas e relatórios diretamente aqui.</div>`;

    if (ev.midia === 'imagem') {
      const src = '/api/evidencia?ref=' + encodeURIComponent(ev.ref) + '&v=' + encodeURIComponent(ev.sha256 || '');
      return `${meta}<img class="ev-img" src="${src}" alt="${esc(baseName(ev.ref))}" data-zoom-img="${src}">`;
    }
    const cached = UI.reviewEvidenceCache[ev.ref];
    if (!cached || cached.loading) return `${meta}<p class="muted">Carregando visualização...</p>`;
    if (cached.erro) return `${meta}<div class="alert-strip">${esc(cached.erro)}</div>`;
    if (cached.midia === 'tabela') {
      return `${meta}<div class="ev-table-wrap"><table class="ev-table"><thead><tr>${(cached.headers || []).map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${(cached.rows || []).map(r => `<tr>${r.map(v => `<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${cached.truncado ? `<span class="muted" style="font-size:12px">Mostrando as primeiras ${cached.max_linhas} linhas.</span>` : ''}`;
    }
    if (cached.midia === 'markdown') return `${meta}<div class="ev-md">${renderMarkdownSafe(cached.conteudo)}</div>`;
    return `${meta}<pre style="margin:0;overflow:auto;max-height:400px;background:var(--surface);padding:12px;border-radius:8px;border:1px solid var(--line)">${esc(cached.conteudo || '')}</pre>`;
  }

    const ct = m.contrato || {};

  function renderAgente(){
    const stages = allStages();
    const pair = findStage(UI.agentStageId) || stages[0];
    if (!pair) return `<div class="main"><div class="card"><p class="muted">Nenhuma etapa cadastrada.</p></div></div>`;

    const modeBar = `<div class="canvas-bar">
      <div class="canvas-bar-group">
        <div class="seg-tabs">
          <button type="button" class="seg-tab" data-agent-view="harness" aria-selected="${UI.agentView === 'harness' ? 'true' : 'false'}">🏗 Arquitetura do Harness</button>
          <button type="button" class="seg-tab" data-agent-view="etapa" aria-selected="${UI.agentView === 'etapa' ? 'true' : 'false'}">🔍 Detalhes por Etapa</button>
        </div>
      </div>
      <div class="canvas-bar-group">
        <span class="muted" style="font-size:12.5px">Entenda como skills, MCPs, scripts, hooks e etapas operam juntos</span>
      </div>
    </div>`;

    if (UI.agentView === 'harness') {
      return `<div class="main full-bleed">${modeBar}${renderHarnessOverview()}</div>`;
    }

    const {m, e} = pair;
    const arq = e._agente || {};
    const dur = arq.contexto_duravel || {};
    const exe = arq.contexto_execucao || {};
    const comps = arq.componentes || [];
    const cSkills = comps.filter(c => c.tipo === 'skill');
    const cMcps = comps.filter(c => c.tipo === 'mcp_tool');
    const cScripts = comps.filter(c => c.tipo !== 'skill' && c.tipo !== 'mcp_tool');
    const guards = arq.guardrails || [];
    const gCode = guards.filter(g => g.natureza === 'codigo');
    const gText = guards.filter(g => g.natureza !== 'codigo');
    const aval = arq.avaliacao || {};
    const active = UI.agentActiveLayer || 'contexto';
    const q = UI.agentSearch.trim().toLowerCase();

  function drawAgentEdges(){
    const svg = document.getElementById('agent-svg');
    const box = document.getElementById('agent-canvas');
    if (!svg || !box) return;
    const br = box.getBoundingClientRect();
    svg.setAttribute('width', box.clientWidth);
    svg.setAttribute('height', box.clientHeight);
    const keys = ['contexto', 'componentes', 'guardrails', 'avaliacao'];
    let out = '<defs><marker id="ag-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="var(--accent)"/></marker></defs>';
    for (let i = 0; i < keys.length - 1; i++) {
      const a = document.getElementById('ag-layer-' + keys[i]);
      const b = document.getElementById('ag-layer-' + keys[i + 1]);
      if (!a || !b) continue;
      const A = a.getBoundingClientRect(), B = b.getBoundingClientRect();
      if (B.left >= A.right - 4) {
        const x1 = A.right - br.left + 2, y1 = A.top + A.height / 2 - br.top;
        const x2 = B.left - br.left - 4, y2 = B.top + B.height / 2 - br.top;
        const mx = (x1 + x2) / 2;
        out += `<path class="e-hot-up" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" marker-end="url(#ag-ar)"/>`;
      }
    }
    svg.innerHTML = out;
  }

  // ==================== MODAIS ====================

      const m = UI.actionModal;
      const meta = ACAO_META[m.acao];
      html += `<div class="modal-bg"><div class="modal-box" role="dialog" aria-modal="true">
        <div style="display:flex;justify-content:space-between;align-items:center">

    }
    if (UI.reviewerModal) {
      html += `<div class="modal-bg"><div class="modal-box" role="dialog" aria-modal="true">

        <p class="muted">Fica salvo no navegador para você aprovar em um clique sem redigitar.</p>

      </div></div>`;
    }
    if (UI.showPolicyModal) {
      const pol = D.politica || {};
      const w = canWrite();
      html += `<div class="modal-bg"><div class="modal-box" role="dialog" aria-modal="true">

        ${UI.policyError ? `<div class="alert-strip">${esc(UI.policyError)}</div>` : ''}
        ${[
          ['acompanhamento_livre','Livre (sem travas)','O agente avança sem bloqueios; o que ele faz continua separado do que você aprovou.'],
          ['so_marcos','Só nos marcos','Apenas os marcos principais precisam da sua aprovação para liberar a próxima fase.'],
          ['por_etapa','Etapa por etapa','Cada etapa precisa da sua aprovação individual antes de seguir.']
        ].map(([k, t, d]) => `<label class="ins-box" style="cursor:pointer;display:flex;gap:10px;align-items:flex-start"><input type="radio" name="pol-m" value="${k}" ${pol.modo === k ? 'checked' : ''} ${w ? '' : 'disabled'}><span><b>${t}</b><div class="muted" style="font-size:12.5px">${d}</div></span></label>`).join('')}
        ${w ? `<input id="pol-rev" class="input" value="${esc(getReviewer())}" placeholder="Seu nome *">
          <input id="pol-just" class="input" placeholder="Por que está mudando a regra? *">
          <div style="display:flex;justify-content:flex-end"><button type="button" class="btn btn-accent" id="btn-save-pol" ${UI.policyBusy ? 'disabled' : ''}>Salvar regra</button></div>` : ''}
      </div></div>`;

    if (UI.lightboxSrc) html += `<div class="lightbox" id="lightbox"><img src="${esc(UI.lightboxSrc)}" alt="Figura ampliada"></div>`;

  // ==================== RENDER PRINCIPAL ====================
  function render(){
    let body = '';
    if (UI.reviewStageId) body = renderRevisao();
    else if (UI.tab === 'agora') body = renderAgora();
    else if (UI.tab === 'projeto') body = renderProjeto();
    else body = renderAgente();

    document.getElementById('app').innerHTML = renderNav() + body + renderModals();
    bindEvents();
    renderToastOnly();
    if (UI.tab === 'projeto' && UI.projetoModo === 'fluxo' && !UI.reviewStageId) requestAnimationFrame(drawArchEdges);
    if (UI.tab === 'agente' && UI.agentView === 'etapa' && !UI.reviewStageId) requestAnimationFrame(drawAgentEdges);
  }

  function bindEvents(){
    document.querySelectorAll('[data-go-home]').forEach(b => b.addEventListener('click', goHome));
    document.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => { UI.openMenuId = null; UI.reviewStageId = null; UI.tab = b.dataset.tab; render(); }));
    document.querySelectorAll('[data-tab-jump]').forEach(b => b.addEventListener('click', () => { UI.openMenuId = null; UI.reviewStageId = null; UI.tab = b.dataset.tabJump; render(); }));

    document.querySelectorAll('[data-scroll-sec]').forEach(b => b.addEventListener('click', () => {
      const el = document.getElementById(b.dataset.scrollSec);
      if (el) el.scrollIntoView({behavior: 'smooth', block: 'start'});
    }));
    document.querySelectorAll('[data-jump-phase]').forEach(b => b.addEventListener('click', () => {
      focusWhereAmI(b.dataset.jumpPhase, b.dataset.jumpMod || null, null);
    }));
    const bHW = document.getElementById('btn-home-where'); if (bHW) bHW.addEventListener('click', () => focusWhereAmI());
    const bKW = document.getElementById('btn-kpi-where'); if (bKW) bKW.addEventListener('click', () => focusWhereAmI());
    const bWI = document.getElementById('btn-where-am-i'); if (bWI) bWI.addEventListener('click', () => focusWhereAmI());

    const qBtn = document.getElementById('btn-toggle-q'); if (qBtn) qBtn.addEventListener('click', () => { UI.showQuestion = !UI.showQuestion; render(); });
    const btnTheme = document.getElementById('btn-theme');
    if (btnTheme) btnTheme.addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme');
      const isDark = cur ? cur === 'dark' : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      const next = isDark ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('specboard.theme', next); } catch(e) {}
    });
    const btnRef = document.getElementById('btn-refresh');
    if (btnRef) btnRef.addEventListener('click', async () => {
      const r = await fetch('/api/estado');
      if (r.ok) { D = await r.json(); UI.reviewEvidenceCache = {}; render(); showToast('Painel atualizado.'); }
    });

    const btnRevr = document.getElementById('btn-reviewer'); if (btnRevr) btnRevr.addEventListener('click', () => { UI.reviewerModal = true; render(); });
    const btnCloseRevr = document.getElementById('btn-close-revr'); if (btnCloseRevr) btnCloseRevr.addEventListener('click', () => { UI.reviewerModal = false; render(); });
    const btnSaveRevr = document.getElementById('btn-save-revr');
    if (btnSaveRevr) btnSaveRevr.addEventListener('click', () => { setReviewer(document.getElementById('revr-input').value); UI.reviewerModal = false; render(); showToast('Nome salvo.'); });

    const btnPol = document.getElementById('btn-policy'); if (btnPol) btnPol.addEventListener('click', () => { UI.showPolicyModal = true; UI.policyError = ''; render(); });
    const btnClosePol = document.getElementById('btn-close-pol'); if (btnClosePol) btnClosePol.addEventListener('click', () => { UI.showPolicyModal = false; render(); });
    const btnSavePol = document.getElementById('btn-save-pol');
    if (btnSavePol) btnSavePol.addEventListener('click', async () => {
      const ch = document.querySelector('input[name="pol-m"]:checked');
      const rev = (document.getElementById('pol-rev').value || '').trim();
      const just = (document.getElementById('pol-just').value || '').trim();
      if (!ch || !rev || !just) { UI.policyError = 'Preencha seu nome e o motivo.'; render(); return; }
      setReviewer(rev); UI.policyBusy = true; render();
      const {status, data} = await apiPost('/api/politica', {modo: ch.value, revisor: rev, justificativa: just});
      UI.policyBusy = false;
      if (status === 200 && data.payload) { D = data.payload; UI.showPolicyModal = false; render(); showToast('Regra de aprovação atualizada.'); }
      else { UI.policyError = data.erro || 'Erro ao salvar.'; render(); }
    });

    document.querySelectorAll('[data-toggle-menu]').forEach(b => b.addEventListener('click', ev => {
      ev.stopPropagation();
      const k = b.dataset.toggleMenu;
      UI.openMenuId = UI.openMenuId === k ? null : k;
      render();
    }));
    document.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', ev => { ev.stopPropagation(); triggerAction(b.dataset.sid, b.dataset.act); }));
    document.querySelectorAll('[data-open-review]').forEach(b => b.addEventListener('click', ev => { ev.stopPropagation(); openReview(b.dataset.openReview, b.dataset.qidxBtn !== undefined ? Number(b.dataset.qidxBtn) : null); }));
    document.querySelectorAll('[data-open-review-ev]').forEach(b => b.addEventListener('click', ev => { ev.stopPropagation(); openReview(b.dataset.openReviewEv, null, Number(b.dataset.evOpenIdx || 0)); }));
    document.querySelectorAll('[data-goto-agent]').forEach(b => b.addEventListener('click', ev => { ev.stopPropagation(); jumpToAgent(b.dataset.gotoAgent); }));
    document.querySelectorAll('[data-goto-mod]').forEach(b => b.addEventListener('click', () => {
      const m = findMod(b.dataset.gotoMod);
      if (m) focusWhereAmI(m.fase || '—', m.id, null);
    }));
    document.querySelectorAll('[data-lock-mod]').forEach(b => b.addEventListener('click', () => lockContractNow(b.dataset.lockMod)));

    const closeAct = () => { UI.actionModal = null; render(); };
    const bCA = document.getElementById('btn-close-act'); if (bCA) bCA.addEventListener('click', closeAct);
    const bCnA = document.getElementById('btn-cancel-act'); if (bCnA) bCnA.addEventListener('click', closeAct);
    const bCfA = document.getElementById('btn-confirm-act');
    if (bCfA) bCfA.addEventListener('click', () => {
      const m = UI.actionModal; if (!m) return;
      const revEl = document.getElementById('act-revisor');
      const rev = revEl ? revEl.value.trim() : getReviewer();
      const nota = (document.getElementById('act-nota').value || '').trim();
      if (!rev) { UI.actionError = 'Informe seu nome.'; render(); return; }
      if (m.exigeNota && !nota) { UI.actionError = 'Informe brevemente o motivo.'; render(); return; }
      setReviewer(rev);
      executeAction(m.etapaId, m.acao, rev, nota);
    });

    document.querySelectorAll('[data-qfilter]').forEach(b => b.addEventListener('click', () => { UI.openMenuId = null; UI.queueFilter = b.dataset.qfilter; render(); }));
    const bAllB = document.getElementById('btn-all-bloqs'); if (bAllB) bAllB.addEventListener('click', () => { UI.showAllBlockers = !UI.showAllBlockers; render(); });
    const bVis = document.getElementById('btn-mark-visit');
    if (bVis) bVis.addEventListener('click', async () => {
      if (canWrite()) {
        const {status, data} = await apiPost('/api/visita', {revisor: getReviewer()});
        if (status === 200 && data.payload) { D = data.payload; render(); showToast('Ponto de visita salvo.'); return; }
      }
      try { localStorage.setItem(projectKey('visita'), JSON.stringify({event_ids:(D.eventos || []).map(x => x.id), registrada_em: new Date().toLocaleString('pt-BR')})); } catch(e) {}
      render(); showToast('Ponto de visita salvo.');
    });

    const ps = document.getElementById('proj-search'); if (ps) ps.addEventListener('input', () => { UI.projetoSearch = ps.value; render(); document.getElementById('proj-search').focus(); });
    document.querySelectorAll('[data-pfilter]').forEach(b => b.addEventListener('click', () => { UI.projetoFiltro = b.dataset.pfilter; render(); }));
    const bzOut = document.getElementById('btn-z-out'); if (bzOut) bzOut.addEventListener('click', () => { UI.zoom = Math.max(0.65, +(UI.zoom - 0.1).toFixed(2)); render(); });
    const bzIn = document.getElementById('btn-z-in'); if (bzIn) bzIn.addEventListener('click', () => { UI.zoom = Math.min(1.35, +(UI.zoom + 0.1).toFixed(2)); render(); });
    const bzRes = document.getElementById('btn-z-reset'); if (bzRes) bzRes.addEventListener('click', () => { UI.zoom = 1; UI.hoverModId = null; render(); });
    const bExpAll = document.getElementById('btn-exp-all');
    if (bExpAll) bExpAll.addEventListener('click', () => {
      const mods = D.estado.modulos || [];
      if (UI.expandedModules.size >= mods.length) UI.expandedModules.clear();
      else { fasesList().forEach(f => UI.expandedPhases.add(f)); mods.forEach(m => UI.expandedModules.add(m.id)); }
      render();
    });
    const bPM = document.getElementById('btn-proj-mode'); if (bPM) bPM.addEventListener('click', () => { UI.projetoModo = UI.projetoModo === 'fluxo' ? 'lista' : 'fluxo'; render(); });
    document.querySelectorAll('[data-toggle-phase]').forEach(b => b.addEventListener('click', () => {
      const f = b.dataset.togglePhase;
      if (UI.expandedPhases.has(f)) UI.expandedPhases.delete(f); else UI.expandedPhases.add(f);
      render();
    }));
    document.querySelectorAll('[data-toggle-mod]').forEach(b => b.addEventListener('click', () => {
      const mid = b.dataset.toggleMod;
      if (UI.expandedModules.has(mid)) { UI.expandedModules.delete(mid); if (UI.selectedModId === mid && !UI.selectedStageId) UI.selectedModId = null; }
      else { UI.expandedModules.add(mid); UI.selectedModId = mid; UI.selectedStageId = null; }
      render();
    }));
    document.querySelectorAll('[data-select-stage]').forEach(el => el.addEventListener('click', ev => {
      if (ev.target.closest('button') && !el.matches('button')) return;
      const sid = el.dataset.selectStage, p = findStage(sid);
      if (UI.selectedStageId === sid) UI.selectedStageId = null;
      else { UI.selectedStageId = sid; if (p) { UI.selectedModId = p.m.id; UI.expandedModules.add(p.m.id); } }
      render();
    }));
    const bCI = document.getElementById('btn-close-ins'); if (bCI) bCI.addEventListener('click', () => { UI.selectedStageId = null; UI.selectedModId = null; render(); });

    const bCR = document.getElementById('btn-close-rev'); if (bCR) bCR.addEventListener('click', closeReview);
    document.querySelectorAll('[data-ev-idx]').forEach(b => b.addEventListener('click', () => {
      UI.reviewEvIndex = Number(b.dataset.evIdx);
      const pair = findStage(UI.reviewStageId);
      const ev = pair && pair.e._snapshot && pair.e._snapshot.evidencias[UI.reviewEvIndex];
      render();
      if (ev && ev.estado === 'ok') loadEvidencePreview(ev.ref, ev.midia);
    }));
    document.querySelectorAll('[data-zoom-img]').forEach(img => img.addEventListener('click', () => { UI.lightboxSrc = img.dataset.zoomImg; render(); }));
    const lb = document.getElementById('lightbox'); if (lb) lb.addEventListener('click', () => { UI.lightboxSrc = ''; render(); });

    function readRevForm(){
      const rev = (document.getElementById('rev-revisor') && document.getElementById('rev-revisor').value || '').trim();
      const nota = (document.getElementById('rev-nota') && document.getElementById('rev-nota').value || '').trim();
      return {rev, nota};
    }
    const revAction = (acao, reqNota) => {
      const {rev, nota} = readRevForm();
      if (!rev) { showToast('Informe seu nome antes de salvar.', true); return; }
      if (reqNota && !nota) { showToast('Escreva brevemente o motivo no campo de comentário.', true); return; }
      setReviewer(rev);
      executeAction(UI.reviewStageId, acao, rev, nota);
    };
    const bDA = document.getElementById('btn-dec-aprovar'); if (bDA) bDA.addEventListener('click', () => revAction('verificado', false));
    const bDC = document.getElementById('btn-dec-correcao'); if (bDC) bDC.addEventListener('click', () => revAction('pedir_correcao', true));
    const bDW = document.getElementById('btn-dec-aguardar'); if (bDW) bDW.addEventListener('click', () => revAction('aguardar_decisao', false));
    const bDB = document.getElementById('btn-dec-bloquear'); if (bDB) bDB.addEventListener('click', () => revAction('bloquear', true));
    const bDU = document.getElementById('btn-dec-desbloquear'); if (bDU) bDU.addEventListener('click', () => revAction('desbloquear', false));
    const bDR = document.getElementById('btn-dec-revisado'); if (bDR) bDR.addEventListener('click', () => revAction('revisado', false));
    const bDD = document.getElementById('btn-dec-depois'); if (bDD) bDD.addEventListener('click', closeReview);

    // Eventos da aba Harness & Agente
    document.querySelectorAll('[data-agent-view]').forEach(b => b.addEventListener('click', () => { UI.agentView = b.dataset.agentView; render(); }));
    document.querySelectorAll('[data-harness-focus]').forEach(b => b.addEventListener('click', () => { UI.harnessFocus = b.dataset.harnessFocus; render(); }));
    const bMS = document.getElementById('btn-mode-stage'); if (bMS) bMS.addEventListener('click', () => { UI.agentView = 'etapa'; render(); });
    document.querySelectorAll('[data-pick-agent-jump]').forEach(b => b.addEventListener('click', () => {
      UI.agentStageId = b.dataset.pickAgentJump; UI.agentView = 'etapa'; UI.agentContextBundle = null; render();
    }));
    document.querySelectorAll('[data-open-mod-agent]').forEach(b => b.addEventListener('click', () => {
      const m = findMod(b.dataset.openModAgent);
      if (m && m.etapas && m.etapas.length) { UI.agentStageId = m.etapas[0].id; UI.agentView = 'etapa'; UI.agentContextBundle = null; render(); }
    }));

    const agS = document.getElementById('agent-search'); if (agS) agS.addEventListener('input', () => { UI.agentSearch = agS.value; render(); document.getElementById('agent-search').focus(); });
    document.querySelectorAll('[data-pick-agent]').forEach(b => b.addEventListener('click', () => { UI.agentStageId = b.dataset.pickAgent; UI.agentContextBundle = null; render(); }));
    document.querySelectorAll('[data-pick-layer]').forEach(b => b.addEventListener('click', () => { UI.agentActiveLayer = b.dataset.pickLayer; render(); }));
    const bAB = document.getElementById('btn-agent-back'); if (bAB) bAB.addEventListener('click', returnFromAgent);
    const bGC = document.getElementById('btn-gen-context');
    if (bGC) bGC.addEventListener('click', async () => {
      const sid = UI.agentStageId; if (!sid) return;
      if (D.modo_servidor) {
        const r = await fetch('/api/contexto/' + encodeURIComponent(sid));
        if (r.ok) { UI.agentContextBundle = await r.json(); render(); return; }
      }
      const p = findStage(sid);
      if (p) { UI.agentContextBundle = {etapa: p.e.id, titulo: p.e.titulo, agente: p.e._agente || {}}; render(); }
    });
  }

  document.addEventListener('click', () => { if (UI.openMenuId) { UI.openMenuId = null; render(); } });
  window.addEventListener('resize', () => {
    if (UI.tab === 'projeto' && UI.projetoModo === 'fluxo' && !UI.reviewStageId) requestAnimationFrame(drawArchEdges);
    if (UI.tab === 'agente' && UI.agentView === 'etapa' && !UI.reviewStageId) requestAnimationFrame(drawAgentEdges);
  });
  document.addEventListener('keydown', ev => {
    if (ev.key === 'Escape') {
      if (UI.lightboxSrc) { UI.lightboxSrc = ''; render(); }
      else if (UI.actionModal) { UI.actionModal = null; render(); }
      else if (UI.reviewerModal) { UI.reviewerModal = false; render(); }
      else if (UI.showPolicyModal) { UI.showPolicyModal = false; render(); }
      else if (UI.openMenuId) { UI.openMenuId = null; render(); }
      else if (UI.reviewStageId) closeReview();
    }
  });

  try { const th = localStorage.getItem('specboard.theme'); if (th) document.documentElement.setAttribute('data-theme', th); } catch(e) {}
  render();
})();
</script>
</body>
</html>
